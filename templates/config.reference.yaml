# ludics configuration — exhaustive reference with all defaults
# You can either copy this file wholesale to ~/.config/ludics/config.yaml,
# or cherry-pick only the settings you want to override (unset keys use
# the defaults shown here).

# Global orchestration backend: "t3code" or "tmux" (default: t3code)
# t3code: WebSocket-based agent management via Claude Agent SDK
# tmux: terminal multiplexer + ttyd web terminals — agents run as CLI processes
adapter: t3code

# Where to store state (your private repo)
state_repo: your-username/your-private-repo
state_path: harness                   # Subdirectory within the state repo

# Number of concurrent slots (default: 6, a forcing function)
slots:
  count: 6

# Projects to track
projects:
  - name: my-project
    repo: your-username/my-project
    upstream_repo: ""      # Optional: upstream repo for issue sync and staging-vs-upstream lag reporting.
                          # PR creation targets the working (staging) repo. Triggers a once-daily fast-forward-only
                          # pull from upstream/<default> into origin/<default> on the canonical checkout
                          # (see mag.enable_staging_fast_forward below). For outbound staging→upstream push,
                          # see outbound_sync_enabled below.
    outbound_sync_enabled: false  # Optional, default false. When true AND upstream_repo is set, the once-daily
                          # keepalive tick attempts `git push upstream origin/<default>:<default>` from the
                          # staging checkout when origin is strictly ahead of upstream. Fast-forward-only by
                          # construction: client-side `git merge-base --is-ancestor` pre-check plus server-side
                          # non-ff rejection (no --force / --force-with-lease). Throttled via
                          # mag/last-outbound-fast-forward-<project>.epoch. Absent → off (legacy configs stay off).
    path: ~/my-project    # Local checkout path (used for slot start, worktree creation).
                          # A leading ~/ is expanded against the RESOLVING machine's $HOME — so a
                          # ~/-relative string already bridges same-OS cluster machines. For
                          # clusters with divergent roots (macOS /Users vs Linux /home) that ~/
                          # cannot bridge, `path` may instead be a map keyed by cluster machine
                          # name or OS identifier (`macos` / `linux` — matching cluster.machines[].os,
                          # NOT `darwin`), selected most-specific-first (machine name → OS), e.g.:
                          #   path:
                          #     mac-studio: ~/ocaml-cudajit   # machine-specific wins
                          #     linux: ~/ocaml-cudajit        # all linux machines
                          #     macos: ~/ocaml-cudajit
                          # The controller resolves `path` FOR the destination machine at dispatch
                          # and ships it unexpanded; the worker expands ~/ against its own $HOME.
    issues: true          # Include GitHub issues as tasks
    priority: false       # Priority project: preempt slots when tasks arrive
    postponed: false      # When true, tasks from this project are excluded from the ready queue,
                          # auto-assignment, and auto-start. For temporarily disabling processing
                          # (e.g. required machine unavailable).
    milestones: false     # When true, task sorting uses milestone as primary key (lexicographic).
                          # For GitHub-backed tasks, milestone syncs from GitHub's milestone field.
                          # Tasks missing milestone field emit a warning during tasks sync.
    proposals_path: ""    # Optional: proposal doc dir relative to project root.
                          # Auto-detected from docs/, doc/, .docs/ if unset; defaults to docs/proposals/
    codex_review_prompt: ""   # Optional: custom focus for GitHub-native @codex review comments.
                              # Default: "Focus on bugs, correctness issues, and edge cases."
    test_command: ""          # Optional: command to run the project's test suite locally
                              # (e.g. "bun test", "dune runtest", "npm test").
                              # Auto-detected from project directory contents when unset.
    requirements:              # Optional: hardware/OS requirements for slot assignment.
      os: ""                   # Target machine OS: macos | linux | windows
      gpu: ""                  # Target machine GPU: apple-silicon | nvidia | amd
                               # Tasks in this project only auto-assign to matching machines.
                               # Task frontmatter requirements override project-level values.
    requires_t3code: false     # Optional, default false. When true, test-health skips this project
                               # while mag.t3code_integration_enabled is false (gh-ludics-539).
    # Per-project adapter args profile (optional).
    # Later layers override earlier: adapter default → project profile → slot args → task frontmatter
    adapter_profiles: {}
    #   agent-claude:
    #     args: ["--timeout", "5400"]

  - name: personal
    repo: your-username/private-repo
    issues: true          # Chores, reminders, etc.

# Adapter settings
# Available adapters: agent-claude, agent-codex, t3code,
#                     claude-ai, chatgpt-com, manual
adapters:
  agent-claude:
    enabled: true         # Claude Code CLI agent
    default_args: []      # Optional default args (argv array or shell string)
  agent-codex:
    enabled: true         # Codex CLI agent
    default_args: []      # Optional default args (argv array or shell string)
  t3code:
    enabled: true         # Shared T3 Code server / thread-based Codex sessions
    default_args: []      # Optional default args, e.g. ["--model", "gpt-5.4"]
  claude-ai:
    enabled: true         # Claude.ai web interface
    default_args: []      # Optional default args (argv array or shell string)
  chatgpt-com:
    enabled: true         # ChatGPT.com web interface
    default_args: []      # Optional default args (argv array or shell string)
  manual:
    enabled: true         # Manual human work tracking
    default_args: []      # Optional default args (argv array or shell string)

# Mag: Autonomous coordinator (Claude Opus in Claude Code)
# Provides strategic thinking while automation handles reliable execution
mag:
  enabled: false
  session: ludics-mag         # tmux session name
  ttyd_port: 7679            # Web terminal port (tmux-ttyd backend only)
  keepalive_interval: 60      # Keepalive trigger interval in seconds (default: 60)
  ensure_t3code: true         # Auto-start shared t3code server on keepalive (default: true)
  t3code_integration_enabled: false  # Gate t3code integration surfaces (session discovery, adapter
                                     # assignment, orchestration auto-flag selection, health-check
                                     # findings). Default false — integration is paused (gh-ludics-539).
                                     # Re-engage by setting true and committing.
  enable_staging_fast_forward: true  # Once-daily fast-forward of each upstream-aware project's staging default branch
                                     # from upstream/<default> (default: true). Fast-forward-only, never pushes, never
                                     # touches slot worktrees, aborts on dirty tree or divergence. Disable with `false`.
  stall_threshold_seconds: 120    # How long pane output must be unchanged before a stall nudge (default: 120)
  stall_nudge_cooldown_seconds: 120  # Minimum gap between stall nudges (default: 120)
  test_health_night_hours: [0, 6]  # Local-time hour window [start, end) during which test suites
                                   # are eligible to run. Uses local time to match launchd semantics.
                                   # Tests also run if last run was 24+ hours ago (stale fallback).
  startup_watchdog_seconds: 60    # Seconds to wait for Mag startup before declaring failure (default: 60)
  startup_helper_stuck_seconds: 45  # Seconds before a startup helper is considered stuck (default: 45)
  cleanup_delay_hours: 25         # Hours to wait before cleaning up completed task worktrees (default: 25, max: 72)
  auto_assign_grace_seconds: 75   # Grace window before the keepalive auto-fill may claim a newly-assignable
                                  # task for an empty slot (default: 75 — reliably spans one 60s beat). A
                                  # freshly-ready task waits ~1 beat before auto-assign, giving a predictable
                                  # manual-intervention window. Gates auto-ASSIGN only, not auto-launch/start.

  # Orchestration settings (overridable per-task via adapter -A args)
  orchestration:
    default_mode: pair           # pair = one slot per task; duo = hierarchical duo (two pair slots per task with swapped roles)
    default_coder: claude-code   # Default coder provider for auto-selected sessions: claude-code | codex
    default_reviewer: codex      # Default reviewer provider for auto-selected sessions: codex | claude-code
    coder_model: ""              # Model ID for the coder agent (e.g. claude-opus-4-8); empty = provider default
    reviewer_model: ""           # Model ID for the reviewer agent; empty = provider default
    # High-end Claude model class per role, for medium/large effort claude-code
    # sessions only (task-13dee93b): claude-opus (default) | claude-fable.
    # Selecting claude-fable runs claude-fable-5 (the tier above Opus) on
    # medium/large sessions for that role; tiny/small + pilot/solo stay on Sonnet,
    # and Codex / explicit model overrides are unaffected. Fable is promo-gated to
    # 2026-06-22 and may be absent on a subscription plan; if a claude-fable session
    # fails to launch, set the key back to claude-opus (there is no silent fallback).
    coder_class: claude-opus     # High-end Claude class for the coder: claude-opus | claude-fable
    reviewer_class: claude-opus  # High-end Claude class for the reviewer: claude-opus | claude-fable
    coder_effort: "high"         # Effort level for the coder: low | medium | high | xhigh | max; default: high
    reviewer_effort: "high"      # Effort level for the reviewer: low | medium | high | xhigh | max; default: high
    # Latest-within-class default models — the SINGLE SOURCE OF TRUTH for the
    # model an unspecified orchestration session runs. HOW TO BUMP: when a new
    # minor ships, change the value here — this is a config edit, NOT a code
    # change. A missing/blank tracked class FAILS LOUDLY at session start,
    # before any worktree/session is created (resolveModelClass in
    # src/orchestration/model-defaults.ts). Provider is not class: a
    # claude-code coder resolves to its high-end class (claude-opus by default, or
    # claude-fable when coder_class/reviewer_class selects it) for medium/large
    # effort and claude-sonnet otherwise; codex coder/reviewer resolve to the codex
    # class. claude-fable is a selectable high-end CLASS, not a provider.
    model_classes:
      codex: gpt-5.5                    # latest GPT-5 (codex coder/reviewer default)
      claude-opus: claude-opus-4-8      # latest Opus 4 (default high-end claude-code class)
      claude-sonnet: claude-sonnet-4-6  # latest Sonnet 4 (tiny/small coder + claude-code default)
      claude-fable: claude-fable-5      # latest Fable 5 (opt-in high-end class; promo-gated to 2026-06-22)
    # Unified ladder — same rung means same relative budget across providers.
    # Per-provider CLI/wire mapping:
    #   unified  | claude-code --effort | codex model_reasoning_effort
    #   ---------|----------------------|-----------------------------
    #   low      | low                  | minimal
    #   medium   | medium               | low
    #   high     | high                 | medium
    #   xhigh    | xhigh                | high
    #   max      | max                  | xhigh
    # Legacy aliases (still accepted): coder_thinking_effort, reviewer_thinking_effort
    # Seconds to wait after the initial pr-comments transition before posting the
    # explicit `@codex review` request, when no Codex review/comment is already present
    # at that point (gh-ludics-604). 0 (default) posts immediately on the first eligible
    # poll; a positive value adds a grace period (e.g. 120) if redundant remote reviews
    # appear. Decoupled from the human-comment quiet window. Per-task override:
    # `-A "--codex-review-request-delay <seconds>"`.
    codex_review_request_delay: 0
    phase_timeouts:              # Per-phase timeout overrides in seconds (unset phases use built-in defaults)
      work: 7200
      review: 3600
      gather: 1200
      clarify: 1200
      pushback: 1200
      plan: 1200
      plan-review: 1200
      update-docs: 1200
      pr-create: 1200
      pr-comments: 7200
      merge-vote: 1200
      merge-debate: 1200
      merge-execute: 3600
      merge-review: 1200
      merge-amend: 1200
      suggest-refactor: 1200
      final-merge: 3600
    # Substantive-diff hung-detector knobs (task-a670cdbf). Distinct from the
    # outer mag.stall_threshold_seconds which controls Mag-coordinator stall
    # nudging. The hung detector trims shared prefix/suffix from successive
    # 50-line tmux pane captures and counts the residual diff; under-threshold
    # sustained for `threshold_seconds` is hung. Recovery: breakAndPrompt
    # (one C-c + sendTurn); on second detection escalates to interruptAgent.
    substantive_stall:
      threshold_seconds: 1200      # Sustained-low-diff window before hung is declared (default: 1200, 20 min)
      min_chars: 30                # Pane diff floor for "substantive" output (default: 30; codex spinner ~8-12 chars/sec)
      min_pct: 0.05                # Pane diff percent floor for short panes (default: 0.05)
      nudge_cooldown_seconds: 180  # Cooldown between breakAndPrompt and force-settle escalation (default: 180, 3 min)
      max_nudge_attempts: 2        # 1 breakAndPrompt + 1 force-settle (default: 2)

  # Autonomy levels: auto | suggest | manual
  autonomy_level:
    elaborate_tasks: auto       # Auto writes detailed specs
    infer_dependencies: auto    # Auto adds blocks/blocked-by
    suggest_priorities: suggest # Suggests, doesn't set
    preempt_slots: suggest      # Preempt a slot for priority project tasks
    assign_to_slots: manual     # Requires approval
    # start_sessions: Controls whether Mag auto-starts sessions after proposal completion.
    #   manual  — defers to user with proposal notification + launch buttons (default)
    #   suggest — defers to user with proposal notification + launch buttons
    #   auto    — auto-starts high-confidence proposals; defers low-confidence to user with launch buttons
    start_sessions: manual

# Dashboard settings
dashboard:
  port: 7678                    # HTTP server port (default: 7678)
  ttl: 5                        # Data regeneration TTL in seconds (default: 5)

# Three-tier notification system via ntfy.sh
notifications:
  provider: ntfy              # Currently only ntfy.sh supported
  token: ""                   # Bearer token for ntfy.sh authentication (optional)

  # Topic names (use random suffixes for privacy without ntfy subscription)
  topics:
    pai: your-username-pai           # Private strategic (Mag)
    agents: your-username-agents     # Private operational (workers)
    public: your-username-public     # Public read-only (broadcasts)

  # Priority levels by event type (1=min, 5=urgent; default: 3)
  priorities:
    briefing: 3
    health_check: 3
    deadline_7days: 4
    deadline_3days: 5
    critical_alert: 5

  # What gets auto-published to public topic
  public_filter:
    auto_publish:
      - release_completed
      - paper_accepted
      - talk_accepted

    never_publish:
      - debugging_info
      - private_deadlines
      - internal_tasks
      - slot_states

# Triggers (macOS launchd / Linux systemd)
triggers:
  # Run at system login
  startup:
    enabled: false
    action: mag briefing --auto

  # Periodic sync (e.g., every hour)
  sync:
    enabled: false
    interval: 3600            # seconds
    action: tasks sync

  # Morning briefing (StartCalendarInterval). The --auto flag makes the
  # trigger a no-op if the briefing → feedback-digest → /compact sequence
  # was queued less than 90 minutes ago (e.g. you ran it manually earlier).
  morning:
    enabled: false
    hour: 8                   # 08:00
    minute: 0
    action: mag briefing --auto

  # Periodic health check (wall-clock aligned)
  health:
    enabled: false
    schedule:                 # Array of {hour, minute} entries (replaces interval)
      - { hour: 14, minute: 20 }
      - { hour: 20, minute: 20 }
      - { hour: 2,  minute: 20 }
    action: mag health-check --auto

  # Periodic session discovery + adoption (assign orphaned sessions to slots)
  sessions:
    enabled: false
    interval: 300             # 5 minutes in seconds
    action: mag adopt-sessions

  # Detached-session sweeper (cleanup known detached sessions)
  sessions-sweep:
    enabled: false
    interval: 86400           # 24 hours in seconds
    action: sessions sweep

  # t3code stale thread cleanup (remove threads from crashed/force-killed slots)
  t3code-cleanup:
    enabled: false
    interval: 86400           # 24 hours in seconds
    action: t3code cleanup

  # Dashboard server (long-running, KeepAlive/Restart)
  dashboard:
    enabled: false
    port: 7678                  # Override dashboard.port for this trigger

  # Watch for file changes (WatchPaths / PathModified)
  # List of rules — each rule has paths to watch and an action to run.
  # Files from "tasks sync" rules are also scanned for checkboxes/TODOs.
  watch:
    # - paths:
    #     - ~/repos/my-project/README.md
    #     - ~/repos/my-project/ROADMAP.md
    #   action: tasks sync
    # - paths:
    #     - ~/private-state/harness/tasks
    #   action: mag health-check

  # Cluster heartbeat (multi-machine only)
  cluster:
    enabled: false
    interval: 300             # 5 minutes in seconds
    action: cluster tick

# Cluster — multi-machine coordination via Tailscale (or SSH)
#
# Roles:
#   leader  — always-on machine that runs mag, dashboard, triggers, and worker slots.
#             Exactly one machine should be leader. Implicitly also a worker.
#   console — primary user surface. The user is considered active/available when this
#             machine is online. Runs worker slots when available.
#   worker  — runs worker slots only. Joins the cluster when online.
#
# Slot distribution: slots are dynamically assigned to online machines by the leader.
# Machines with `always_on: true` are preferred. GPU affinity can route specific
# projects to machines with matching hardware.
cluster:
  transport: local            # local (single machine) | tailscale | ssh
  domain: ""                  # Tailscale MagicDNS domain (e.g. your-tailnet.ts.net)
  secret: ""                  # Shared Bearer secret for HTTP cluster endpoints. Empty = unauthenticated over
                              # the Tailscale tailnet (the tailnet is the trust boundary). Set a value to
                              # require Bearer auth on every /cluster/* request.
  machines: []
    # - name: desktop
    #   host: desktop.your-tailnet.ts.net
    #   os: macos              # macos | linux | windows
    #   role: leader
    #   always_on: true
    #   gpu: apple-silicon     # apple-silicon | nvidia | amd | (omit if none)
    #   dashboard_port: 7678   # optional, defaults to dashboard.port
    #
    # - name: laptop
    #   host: laptop.your-tailnet.ts.net
    #   os: macos
    #   role: console
    #   always_on: false
    #
    # - name: gpu-server
    #   host: gpu-server.your-tailnet.ts.net
    #   os: linux
    #   role: worker
    #   always_on: false
    #   gpu: nvidia
    #   ludics_path: /home/user/.local/bin/ludics  # optional, defaults to "ludics" (in PATH)
