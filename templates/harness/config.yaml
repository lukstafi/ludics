# ludics harness configuration (private repo)

state_repo: lukstafi/self-improve
state_path: harness

# adapter: t3code    # Global orchestration backend: "t3code" (default) or "tmux"

slots:
  count: 6

projects:
  - name: ocannl
    repo: lukstafi/ocannl-staging      # working repo — where agents create PRs
    upstream_repo: ahrefs/ocannl       # upstream — issues synced from here; staging-vs-upstream lag reported in briefing
    # When true, keepalive's outbound-fast-forward tick runs
    # `git push upstream origin/<default>:<default>` from the staging
    # checkout when origin is strictly ahead of upstream. Fast-forward-only
    # by construction: `git merge-base --is-ancestor` client-side pre-check
    # plus git's server-side non-ff rejection (no --force / --force-with-lease).
    # Throttled via mag/last-outbound-fast-forward-<project>.epoch at 24h
    # cadence. Auth failures surface via health-check's
    # outbound-staging-ff-stale:<project> stable key (no notification).
    # See docs/proposals/gh-ludics-540-outbound-staging-ff.md.
    outbound_sync_enabled: true
    issues: true

  - name: ppx-minidebug
    repo: lukstafi/ppx_minidebug
    issues: true

  - name: personal
    repo: lukstafi/self-improve
    issues: true

adapters:
  agent-claude:
    enabled: true
  claude-ai:
    enabled: true

# Mag: Autonomous coordinator (Claude Opus 4.5 in Claude Code)
mag:
  enabled: true
  session: ludics-mag
  ttyd_port: 7679

  autonomy_level:
    elaborate_tasks: auto
    infer_dependencies: auto
    suggest_priorities: suggest
    assign_to_slots: manual
    start_sessions: manual

# Three-tier notification system
notifications:
  provider: ntfy
  # ntfy web app URL for dashboard iframe (default: https://ntfy.sh/app)
  # app_url: https://ntfy.sh/app

  topics:
    pai: lukstafi-pai
    agents: lukstafi-agents
    public: lukstafi-public

  priorities:
    briefing: 3
    health_check: 3
    deadline_7days: 4
    deadline_3days: 5
    critical_alert: 5

  public_filter:
    auto_publish:
      - release_completed
      - paper_accepted
      - talk_accepted

    never_publish:
      - debugging_info
      - private_deadlines
      - internal_tasks
      - slot_states

triggers:
  startup:
    enabled: true
    action: mag briefing --auto

  sync:
    enabled: true
    interval: 3600
    action: tasks sync

  morning:
    enabled: true
    hour: 8
    minute: 20
    action: mag briefing --auto

  health:
    enabled: true
    schedule:
      - { hour: 14, minute: 20 }
      - { hour: 20, minute: 20 }
      - { hour: 2,  minute: 20 }
    action: mag health-check

  sessions-sweep:
    enabled: false
    interval: 86400
    action: sessions sweep

  t3code-cleanup:
    enabled: false
    interval: 86400
    action: t3code cleanup

  watch:
    - paths:
        - ~/repos/ocannl/README.md
      action: tasks sync

  # Cluster heartbeat (for multi-machine Mag setup)
  cluster:
    enabled: false
    interval: 300
    action: cluster tick

