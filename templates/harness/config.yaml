# ludics harness configuration (private repo)

state_repo: lukstafi/self-improve
state_path: harness

# adapter: t3code    # Global orchestration backend: "t3code" (default) or "tmux"

slots:
  count: 6

projects:
  - name: ocannl
    repo: ahrefs/ocannl               # upstream — used for issue syncing (tasks sync)
    staging_repo: lukstafi/ocannl-staging  # staging fork — where PRs are created
    issues: true

  - name: ppx-minidebug
    repo: lukstafi/ppx_minidebug
    issues: true

  - name: personal
    repo: lukstafi/self-improve
    issues: true

adapters:
  agent-claude:
    enabled: true
  claude-ai:
    enabled: true

# Mag: Autonomous coordinator (Claude Opus 4.5 in Claude Code)
mag:
  enabled: true
  backend: tmux-ttyd
  session: ludics-mag
  ttyd_port: 7679

  autonomy_level:
    elaborate_tasks: auto
    infer_dependencies: auto
    suggest_priorities: suggest
    assign_to_slots: manual
    start_sessions: manual

  schedule:
    briefing: "08:00"
    health_check: "every 4h"
    analyze_repos: "on_change"

# Three-tier notification system
notifications:
  provider: ntfy
  # ntfy web app URL for dashboard iframe (default: https://ntfy.sh/app)
  # app_url: https://ntfy.sh/app

  topics:
    pai: lukstafi-pai
    agents: lukstafi-agents
    public: lukstafi-public

  priorities:
    briefing: 3
    health_check: 3
    deadline_7days: 4
    deadline_3days: 5
    critical_alert: 5

  public_filter:
    auto_publish:
      - release_completed
      - paper_accepted
      - talk_accepted

    never_publish:
      - debugging_info
      - private_deadlines
      - internal_tasks
      - slot_states

triggers:
  startup:
    enabled: true
    action: mag briefing

  sync:
    enabled: true
    interval: 3600
    action: tasks sync

  morning:
    enabled: true
    hour: 8
    minute: 0
    action: mag briefing

  health:
    enabled: true
    schedule:
      - { hour: 14, minute: 20 }
      - { hour: 20, minute: 20 }
      - { hour: 2,  minute: 20 }
    action: mag health-check

  sessions-sweep:
    enabled: false
    interval: 86400
    action: sessions sweep

  watch:
    - paths:
        - ~/repos/ocannl/README.md
      action: tasks sync

  # Federation heartbeat (for multi-machine Mag setup)
  federation:
    enabled: false
    interval: 300
    action: federation tick

# Network settings for dashboard/URL binding
network:
  # Mode: localhost (default) | tailscale
  # Overridden by federation.transport when federation is configured.
  mode: localhost

  # Explicit hostname override (optional)
  # If not set and mode is tailscale, auto-detects from `tailscale status`
  hostname: ""

