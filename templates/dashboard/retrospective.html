<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ludics Retrospective</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .briefing-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
        }

        .briefing-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .briefing-content {
            background-color: var(--bg-panel);
            border-radius: 8px;
            border: 1px solid var(--border);
            padding: 2rem;
            line-height: 1.7;
        }

        .briefing-content h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
        .briefing-content h2 { font-size: 1.125rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.75rem; color: var(--accent); }
        .briefing-content h3 { font-size: 1rem; font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.5rem; }
        .briefing-content p { margin-bottom: 0.75rem; color: var(--text-primary); }
        .briefing-content ul, .briefing-content ol { margin-bottom: 0.75rem; padding-left: 1.5rem; }
        .briefing-content li { margin-bottom: 0.375rem; color: var(--text-primary); }
        .briefing-content strong { color: var(--text-primary); font-weight: 600; }
        .briefing-content code { background-color: var(--bg-secondary); padding: 0.125rem 0.375rem; border-radius: 3px; font-size: 0.875rem; }
        .briefing-content pre { background-color: var(--bg-secondary); padding: 1rem; border-radius: 6px; overflow-x: auto; margin-bottom: 0.75rem; }
        .briefing-content pre code { background-color: transparent; padding: 0; }

        .briefing-placeholder {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 300px; color: var(--text-secondary);
        }
        .briefing-placeholder .icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
        .briefing-placeholder .text { font-size: 1rem; opacity: 0.7; }
        .briefing-placeholder .hint { font-size: 0.875rem; opacity: 0.5; margin-top: 0.5rem; }

        .retro-task-id {
            font-size: 0.875rem; color: var(--text-secondary);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .retro-links { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .retro-links a {
            display: inline-block; padding: 0.25rem 0.75rem; border-radius: 4px;
            background-color: var(--bg-secondary); color: var(--accent); text-decoration: none;
            font-size: 0.875rem; border: 1px solid var(--border);
        }
        .retro-links a:hover { background-color: var(--border); }

        .retro-meta { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 1rem; margin-bottom: 1rem; font-size: 0.875rem; }
        .retro-meta dt { color: var(--text-secondary); font-weight: 500; }
        .retro-meta dd { color: var(--text-primary); margin: 0; }

        .phase-timeline { display: flex; gap: 0.375rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
        .phase-badge {
            display: inline-block; padding: 0.125rem 0.5rem; border-radius: 3px;
            background-color: var(--bg-secondary); color: var(--text-secondary);
            font-size: 0.75rem; border: 1px solid var(--border);
        }

        .verdict-list { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .verdict-badge {
            display: inline-block; padding: 0.125rem 0.5rem; border-radius: 3px;
            font-size: 0.75rem; font-weight: 500;
        }
        .verdict-approve { background-color: rgba(46, 160, 67, 0.15); color: #3fb950; border: 1px solid rgba(46, 160, 67, 0.3); }
        .verdict-request_changes { background-color: rgba(210, 153, 34, 0.15); color: #d29922; border: 1px solid rgba(210, 153, 34, 0.3); }
        .verdict-timeout { background-color: rgba(139, 148, 158, 0.15); color: #8b949e; border: 1px solid rgba(139, 148, 158, 0.3); }

        .thread-summary { margin-bottom: 1.5rem; }
        .thread-card {
            background-color: var(--bg-secondary); border-radius: 6px; padding: 0.75rem 1rem;
            margin-bottom: 0.5rem; font-size: 0.875rem; border: 1px solid var(--border);
        }
        .thread-card .thread-title { font-weight: 500; color: var(--text-primary); }
        .thread-card .thread-meta { color: var(--text-secondary); font-size: 0.8rem; margin-top: 0.25rem; }

        .turn-log { margin-top: 1rem; }
        .turn-entry {
            border-left: 3px solid var(--border); padding: 0.75rem 1rem; margin-bottom: 0.75rem;
            background-color: rgba(255,255,255,0.02); border-radius: 0 6px 6px 0;
        }
        .turn-header { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; }
        .turn-agent {
            font-weight: 600; font-size: 0.875rem; padding: 0.1rem 0.5rem;
            border-radius: 3px; color: #fff;
        }
        .turn-phase { font-size: 0.75rem; color: var(--text-secondary); }
        .turn-time { font-size: 0.75rem; color: var(--text-secondary); }
        .turn-message { font-size: 0.875rem; line-height: 1.6; color: var(--text-primary); }
        .turn-message p { margin-bottom: 0.5rem; }

        /* Agent colors */
        .agent-color-0 { background-color: #1f6feb; }
        .agent-color-1 { background-color: #8957e5; }
        .agent-color-2 { background-color: #d29922; }
        .agent-color-3 { background-color: #da3633; }
        .agent-color-4 { background-color: #3fb950; }

        .turn-entry.agent-border-0 { border-left-color: #1f6feb; }
        .turn-entry.agent-border-1 { border-left-color: #8957e5; }
        .turn-entry.agent-border-2 { border-left-color: #d29922; }
        .turn-entry.agent-border-3 { border-left-color: #da3633; }
        .turn-entry.agent-border-4 { border-left-color: #3fb950; }

        .missing-notice {
            background-color: rgba(210, 153, 34, 0.1); border: 1px solid rgba(210, 153, 34, 0.3);
            border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1rem;
            font-size: 0.875rem; color: #d29922;
        }

        .artifact-summary {
            background-color: var(--bg-secondary); border-radius: 6px; padding: 0.75rem 1rem;
            margin-bottom: 0.75rem; font-size: 0.875rem; border: 1px solid var(--border);
            white-space: pre-wrap; color: var(--text-secondary);
        }

        .status-badge {
            display: inline-block; padding: 0.1rem 0.5rem; border-radius: 3px;
            font-size: 0.75rem; font-weight: 500;
        }
        .status-done { background-color: rgba(46, 160, 67, 0.15); color: #3fb950; }
        .status-abandoned { background-color: rgba(139, 148, 158, 0.15); color: #8b949e; }
    </style>
</head>
<body>
    <header>
        <div class="nav-links">
            <h1>ludics</h1>
            <a href="index.html">Dashboard</a>
            <a href="terminal.html">Mag</a>
            <a href="#" id="t3code-link">t3code</a>
            <a href="ntfy.html">ntfy</a>
            <a href="tasks.html">Tasks</a>
            <a href="briefing.html">Briefing</a>
        </div>
        <div class="status-bar">
            <span id="last-update">Last update: --</span>
            <span id="connection-status" class="connected">Connected</span>
        </div>
    </header>

    <main class="briefing-container">
        <div class="briefing-header">
            <span class="retro-task-id" id="retro-task-id"></span>
        </div>
        <div class="briefing-content" id="retro-content">
            <div class="briefing-placeholder">
                <span class="icon">&#x1F4CB;</span>
                <span class="text">Loading retrospective...</span>
            </div>
        </div>
    </main>

    <footer>
        <p>ludics v0.1 | <a href="https://github.com/lukstafi/ludics">GitHub</a></p>
    </footer>

    <script src="markdown.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const taskId = params.get('task') || '';

        if (taskId) {
            document.title = `ludics Retrospective: ${taskId}`;
            const el = document.getElementById('retro-task-id');
            if (el) el.textContent = taskId;
        }

        document.addEventListener('DOMContentLoaded', () => { fetchRetrospective(); });

        async function fetchRetrospective() {
            const container = document.getElementById('retro-content');
            if (!container) return;

            if (!taskId) {
                container.innerHTML = `<div class="briefing-placeholder">
                    <span class="icon">&#x1F4CB;</span>
                    <span class="text">No task specified</span>
                    <span class="hint">Use ?task=TASK-ID in the URL</span>
                </div>`;
                return;
            }

            try {
                const response = await fetch(`/retrospective-files/${encodeURIComponent(taskId)}.json`);
                if (response.status === 404) {
                    container.innerHTML = `<div class="briefing-placeholder">
                        <span class="icon">&#x1F4CB;</span>
                        <span class="text">Retrospective not available for this task</span>
                        <span class="hint"><a href="index.html">Back to dashboard</a></span>
                    </div>`;
                    setConnectionStatus(true);
                    updateTimestamp();
                    return;
                }
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                container.innerHTML = renderRetrospective(data);
                updateTimestamp();
                setConnectionStatus(true);
            } catch (error) {
                console.warn('Failed to fetch retrospective:', error);
                container.innerHTML = `<div class="briefing-placeholder">
                    <span class="icon">&#x26A0;</span>
                    <span class="text">Failed to load retrospective</span>
                    <span class="hint">${escapeHtml(String(error))}</span>
                </div>`;
                setConnectionStatus(false);
            }
        }

        function renderRetrospective(data) {
            const agentIndex = {};
            (data.agents || []).forEach((name, i) => { agentIndex[name] = i % 5; });

            let html = '';

            // Title and status
            const statusClass = data.status === 'done' ? 'status-done' : 'status-abandoned';
            html += `<h1>${escapeHtml(data.title)} <span class="status-badge ${statusClass}">${escapeHtml(data.status)}</span></h1>`;

            // Links bar
            const links = [];
            if (data.proposalPath) links.push(`<a href="proposal.html?task=${encodeURIComponent(data.taskId)}">Proposal</a>`);
            if (data.prUrl) links.push(`<a href="${escapeHtml(data.prUrl)}" target="_blank">Pull Request</a>`);
            if (data.githubUrl) links.push(`<a href="${escapeHtml(data.githubUrl)}" target="_blank">GitHub Issue</a>`);
            if (links.length > 0) html += `<div class="retro-links">${links.join('')}</div>`;

            // Orchestration summary
            html += '<h2>Orchestration Summary</h2>';
            html += '<dl class="retro-meta">';
            if (data.mode) html += `<dt>Mode</dt><dd>${escapeHtml(data.mode)}</dd>`;
            if (data.agents && data.agents.length > 0) html += `<dt>Agents</dt><dd>${data.agents.map(a => escapeHtml(a)).join(', ')}</dd>`;
            if (data.slot !== null) html += `<dt>Slot</dt><dd>${data.slot}</dd>`;
            html += `<dt>Rounds</dt><dd>${data.rounds || 0}</dd>`;
            if (data.mergeRound) html += `<dt>Merge rounds</dt><dd>${data.mergeRound}</dd>`;
            if (data.planMergeRound) html += `<dt>Plan-merge rounds</dt><dd>${data.planMergeRound}</dd>`;
            if (data.startedAt) html += `<dt>Started</dt><dd>${formatTimeFull(data.startedAt)}</dd>`;
            html += `<dt>Completed</dt><dd>${formatTimeFull(data.completedAt)}</dd>`;
            html += `<dt>Collected</dt><dd>${formatTimeFull(data.collectedAt)}</dd>`;
            html += '</dl>';

            // Phase timeline
            if (data.phases && data.phases.length > 0) {
                html += '<h2>Phase Timeline</h2>';
                html += '<div class="phase-timeline">';
                for (const phase of data.phases) {
                    html += `<span class="phase-badge">${escapeHtml(phase)}</span>`;
                }
                html += '</div>';
            }

            // Review verdicts
            if (data.verdicts && data.verdicts.length > 0) {
                html += '<h2>Review Verdicts</h2>';
                html += '<div class="verdict-list">';
                for (const v of data.verdicts) {
                    const label = v.type === 'plan-review' ? `Plan R${v.round}` : `Round ${v.round}`;
                    const reviewer = v.reviewer ? ` (${escapeHtml(v.reviewer)})` : '';
                    html += `<span class="verdict-badge verdict-${v.verdict}">${escapeHtml(label)}: ${v.verdict.replace(/_/g, ' ')}${reviewer}</span>`;
                }
                html += '</div>';
            }

            // Thread summary
            if (data.threads && data.threads.length > 0) {
                html += '<h2>Threads</h2>';
                html += '<div class="thread-summary">';
                for (const t of data.threads) {
                    const colorIdx = agentIndex[t.agentName] !== undefined ? agentIndex[t.agentName] : 0;
                    html += `<div class="thread-card">
                        <div class="thread-title"><span class="turn-agent agent-color-${colorIdx}">${escapeHtml(t.agentName)}</span> ${escapeHtml(t.title)}</div>
                        <div class="thread-meta">${escapeHtml(t.model)} &middot; ${t.turnCount} turns &middot; created ${formatTimeFull(t.createdAt)}</div>
                    </div>`;
                }
                html += '</div>';
            }

            // Missing threads
            if (data.missingThreads && data.missingThreads.length > 0) {
                html += '<div class="missing-notice">';
                html += '<strong>Missing threads:</strong> ';
                html += data.missingThreads.map(m => `${escapeHtml(m.agentName)} (${escapeHtml(m.reason)})`).join(', ');
                html += '</div>';
            }

            // Turn log
            if (data.turns && data.turns.length > 0) {
                html += '<h2>Turn Log</h2>';
                html += '<div class="turn-log">';
                for (const turn of data.turns) {
                    const colorIdx = agentIndex[turn.agentName] !== undefined ? agentIndex[turn.agentName] : 0;
                    const phaseLabel = turn.phase ? `<span class="turn-phase">${escapeHtml(turn.phase)}</span>` : '';
                    html += `<div class="turn-entry agent-border-${colorIdx}">
                        <div class="turn-header">
                            <span class="turn-agent agent-color-${colorIdx}">${escapeHtml(turn.agentName)}</span>
                            ${phaseLabel}
                            <span class="turn-time" title="${escapeHtml(turn.timestamp)}">${formatTimeRelative(turn.timestamp)}</span>
                        </div>
                        <div class="turn-message">${markdownToHtml(turn.message)}</div>
                    </div>`;
                }
                html += '</div>';
            }

            // Artifacts
            if (data.suggestRefactorSummary || data.workflowFeedbackSummary) {
                html += '<h2>Artifacts</h2>';
                if (data.suggestRefactorSummary) {
                    html += '<h3>Suggest Refactor</h3>';
                    html += `<div class="artifact-summary">${escapeHtml(data.suggestRefactorSummary)}</div>`;
                }
                if (data.workflowFeedbackSummary) {
                    html += '<h3>Workflow Feedback</h3>';
                    html += `<div class="artifact-summary">${escapeHtml(data.workflowFeedbackSummary)}</div>`;
                }
            }

            return html;
        }

        function formatTimeFull(iso) {
            if (!iso) return '--';
            try { return new Date(iso).toLocaleString(); } catch { return iso; }
        }

        function formatTimeRelative(iso) {
            if (!iso) return '--';
            try {
                const diff = Date.now() - new Date(iso).getTime();
                const mins = Math.floor(diff / 60000);
                if (mins < 60) return `${mins}m ago`;
                const hours = Math.floor(mins / 60);
                if (hours < 24) return `${hours}h ago`;
                const days = Math.floor(hours / 24);
                return `${days}d ago`;
            } catch { return iso; }
        }

        function updateTimestamp() {
            const el = document.getElementById('last-update');
            if (el) el.textContent = `Last update: ${new Date().toLocaleTimeString()}`;
        }

        function setConnectionStatus(connected) {
            const el = document.getElementById('connection-status');
            if (el) {
                el.className = connected ? 'connected' : 'disconnected';
                el.textContent = connected ? 'Connected' : 'Disconnected';
            }
        }

        // Resolve t3code link
        (async function() {
            try {
                const resp = await fetch('data/t3code.json');
                if (!resp.ok) return;
                const data = await resp.json();
                const link = document.getElementById('t3code-link');
                if (link && data.available && data.webUrl) {
                    link.href = data.webUrl;
                    link.title = 't3code Web client';
                } else if (link) {
                    link.style.opacity = '0.4';
                    link.style.pointerEvents = 'none';
                    link.title = 't3code server not running';
                }
            } catch { /* ignore */ }
        })();
    </script>
</body>
</html>
