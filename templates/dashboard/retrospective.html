<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ludics Retrospective</title>
    <script>document.documentElement.dataset.theme=localStorage.getItem('ludics-theme')||'night'</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="content.css">
</head>
<body>
    <header>
        <div class="nav-links">
            <h1>ludics</h1>
            <a href="index.html">Dashboard</a>
            <a href="mag.html">Mag</a>
            <a href="#" id="t3code-link">t3code</a>
            <a href="terminals.html">Terminals</a>
            <a href="ntfy.html">ntfy</a>
            <a href="tasks.html">Tasks</a>
            <a href="briefing.html">Briefing</a>
        </div>
        <div class="status-bar">
            <span id="last-update">Last update: --</span>
            <span id="connection-status" class="connected">Connected</span>
        </div>
    </header>
    <script src="nav.js"></script>

    <main class="content-container">
        <div class="content-header">
            <span class="retro-task-id" id="retro-task-id"></span>
        </div>
        <div class="rendered-content" id="retro-content">
            <div class="content-placeholder">
                <span class="icon">&#x1F4CB;</span>
                <span class="text">Loading retrospective...</span>
            </div>
        </div>
    </main>

    <footer>
        <p>ludics v0.1 | <a href="https://github.com/lukstafi/ludics">GitHub</a></p>
    </footer>

    <script type="module" src="markdown.js"></script>
    <script src="links.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const taskId = params.get('task') || '';

        if (taskId) {
            document.title = `ludics Retrospective: ${taskId}`;
            const el = document.getElementById('retro-task-id');
            if (el) el.textContent = taskId;
        }

        document.addEventListener('DOMContentLoaded', () => { fetchRetrospective(); });

        async function fetchRetrospective() {
            const container = document.getElementById('retro-content');
            if (!container) return;

            if (!taskId) {
                container.innerHTML = `<div class="content-placeholder">
                    <span class="icon">&#x1F4CB;</span>
                    <span class="text">No task specified</span>
                    <span class="hint">Use ?task=TASK-ID in the URL</span>
                </div>`;
                return;
            }

            try {
                const response = await fetch(`/retrospective-files/${encodeURIComponent(taskId)}.json`);
                if (response.status === 404) {
                    container.innerHTML = `<div class="content-placeholder">
                        <span class="icon">&#x1F4CB;</span>
                        <span class="text">Retrospective not available for this task</span>
                        <span class="hint"><a href="index.html">Back to dashboard</a></span>
                    </div>`;
                    setConnectionStatus(true);
                    updateTimestamp();
                    return;
                }
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                container.innerHTML = renderRetrospective(data);
                updateTimestamp();
                setConnectionStatus(true);
            } catch (error) {
                console.warn('Failed to fetch retrospective:', error);
                container.innerHTML = `<div class="content-placeholder">
                    <span class="icon">&#x26A0;</span>
                    <span class="text">Failed to load retrospective</span>
                    <span class="hint">${escapeHtml(String(error))}</span>
                </div>`;
                setConnectionStatus(false);
            }
        }

        function renderRetrospective(data) {
            const agentIndex = {};
            (data.agents || []).forEach((name, i) => { agentIndex[name] = i % 5; });

            let html = '';

            // Title and status
            const statusClass = data.status === 'done' ? 'status-done' : 'status-abandoned';
            html += `<h1>${escapeHtml(data.title)} <span class="status-badge ${statusClass}">${escapeHtml(data.status)}</span></h1>`;

            // Links bar
            const links = [];
            if (data.proposalPath) links.push(`<a href="${proposalLink(data.taskId)}">Proposal</a>`);
            if (data.prUrl) links.push(`<a href="${escapeHtml(data.prUrl)}" target="_blank">Pull Request</a>`);
            if (data.githubUrl) links.push(`<a href="${escapeHtml(data.githubUrl)}" target="_blank">GitHub Issue</a>`);
            if (links.length > 0) html += `<div class="retro-links">${links.join('')}</div>`;

            // Orchestration summary
            html += '<h2>Orchestration Summary</h2>';
            html += '<dl class="retro-meta">';
            if (data.mode) html += `<dt>Mode</dt><dd>${escapeHtml(data.mode)}</dd>`;
            if (data.agents && data.agents.length > 0) html += `<dt>Agents</dt><dd>${data.agents.map(a => escapeHtml(a)).join(', ')}</dd>`;
            if (data.slot !== null) html += `<dt>Slot</dt><dd>${data.slot}</dd>`;
            html += `<dt>Rounds</dt><dd>${data.rounds || 0}</dd>`;
            if (data.mergeRound) html += `<dt>Merge rounds</dt><dd>${data.mergeRound}</dd>`;
            if (data.planMergeRound) html += `<dt>Plan-merge rounds</dt><dd>${data.planMergeRound}</dd>`;
            if (data.startedAt) html += `<dt>Started</dt><dd>${formatTimeFull(data.startedAt)}</dd>`;
            html += `<dt>Completed</dt><dd>${formatTimeFull(data.completedAt)}</dd>`;
            html += `<dt>Collected</dt><dd>${formatTimeFull(data.collectedAt)}</dd>`;
            html += '</dl>';

            // Phase timeline
            if (data.phases && data.phases.length > 0) {
                html += '<h2>Phase Timeline</h2>';
                html += '<div class="phase-timeline">';
                for (const phase of data.phases) {
                    html += `<span class="phase-badge">${escapeHtml(phase)}</span>`;
                }
                html += '</div>';
            }

            // Review verdicts
            if (data.verdicts && data.verdicts.length > 0) {
                html += '<h2>Review Verdicts</h2>';
                html += '<div class="verdict-list">';
                for (const v of data.verdicts) {
                    const label = v.type === 'plan-review' ? `Plan R${v.round}` : `Round ${v.round}`;
                    const reviewer = v.reviewer ? ` (${escapeHtml(v.reviewer)})` : '';
                    html += `<span class="verdict-badge verdict-${v.verdict}">${escapeHtml(label)}: ${v.verdict.replace(/_/g, ' ')}${reviewer}</span>`;
                }
                html += '</div>';
            }

            // Thread summary
            if (data.threads && data.threads.length > 0) {
                html += '<h2>Threads</h2>';
                html += '<div class="thread-summary">';
                for (const t of data.threads) {
                    const colorIdx = agentIndex[t.agentName] !== undefined ? agentIndex[t.agentName] : 0;
                    html += `<div class="thread-card">
                        <div class="thread-title"><span class="turn-agent agent-color-${colorIdx}">${escapeHtml(t.agentName)}</span> ${escapeHtml(t.title)}</div>
                        <div class="thread-meta">${escapeHtml(t.model)} &middot; ${t.turnCount} turns &middot; created ${formatTimeFull(t.createdAt)}</div>
                    </div>`;
                }
                html += '</div>';
            }

            // Missing threads
            if (data.missingThreads && data.missingThreads.length > 0) {
                html += '<div class="missing-notice">';
                html += '<strong>Missing threads:</strong> ';
                html += data.missingThreads.map(m => `${escapeHtml(m.agentName)} (${escapeHtml(m.reason)})`).join(', ');
                html += '</div>';
            }

            // Turn log
            if (data.turns && data.turns.length > 0) {
                html += '<h2>Turn Log</h2>';
                html += '<div class="turn-log">';
                for (const turn of data.turns) {
                    const colorIdx = agentIndex[turn.agentName] !== undefined ? agentIndex[turn.agentName] : 0;
                    const phaseLabel = turn.phase ? `<span class="turn-phase">${escapeHtml(turn.phase)}</span>` : '';
                    html += `<div class="turn-entry agent-border-${colorIdx}">
                        <div class="turn-header">
                            <span class="turn-agent agent-color-${colorIdx}">${escapeHtml(turn.agentName)}</span>
                            ${phaseLabel}
                            <span class="turn-time" title="${escapeHtml(turn.timestamp)}">${formatTimeRelative(turn.timestamp)}</span>
                        </div>
                        <div class="turn-message">${markdownToHtml(turn.message)}</div>
                    </div>`;
                }
                html += '</div>';
            }

            // Artifacts
            if (data.suggestRefactorSummary || data.workflowFeedbackSummary) {
                html += '<h2>Artifacts</h2>';
                if (data.suggestRefactorSummary) {
                    html += '<h3>Suggest Refactor</h3>';
                    html += `<div class="artifact-summary">${escapeHtml(data.suggestRefactorSummary)}</div>`;
                }
                if (data.workflowFeedbackSummary) {
                    html += '<h3>Workflow Feedback</h3>';
                    html += `<div class="artifact-summary">${escapeHtml(data.workflowFeedbackSummary)}</div>`;
                }
            }

            return html;
        }

        function formatTimeFull(iso) {
            if (!iso) return '--';
            try { return new Date(iso).toLocaleString(); } catch { return iso; }
        }

        function formatTimeRelative(iso) {
            if (!iso) return '--';
            try {
                const diff = Date.now() - new Date(iso).getTime();
                const mins = Math.floor(diff / 60000);
                if (mins < 60) return `${mins}m ago`;
                const hours = Math.floor(mins / 60);
                if (hours < 24) return `${hours}h ago`;
                const days = Math.floor(hours / 24);
                return `${days}d ago`;
            } catch { return iso; }
        }

        function updateTimestamp() {
            const el = document.getElementById('last-update');
            if (el) el.textContent = `Last update: ${new Date().toLocaleTimeString()}`;
        }

        function setConnectionStatus(connected) {
            const el = document.getElementById('connection-status');
            if (el) {
                el.className = connected ? 'connected' : 'disconnected';
                el.textContent = connected ? 'Connected' : 'Disconnected';
            }
        }

    </script>
</body>
</html>
