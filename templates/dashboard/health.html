<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ludics Health</title>
    <script>document.documentElement.dataset.theme=localStorage.getItem('ludics-theme')||'night'</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="content.css">
</head>
<body>
    <header>
        <div class="nav-links">
            <h1>ludics</h1>
            <a href="index.html">Dashboard</a>
            <a href="mag.html">Mag</a>
            <a href="#" id="t3code-link">t3code</a>
            <a href="terminals.html">Terminals</a>
            <a href="ntfy.html">ntfy</a>
            <a href="tasks.html">Tasks</a>
            <a href="briefing.html">Briefing</a>
            <a href="health.html" class="active">Health</a>
        </div>
        <div class="status-bar">
            <span id="last-update">Last update: --</span>
            <span id="connection-status" class="connected">Connected</span>
        </div>
    </header>
    <script src="nav.js"></script>

    <main class="content-container">
        <h2 class="health-section-title">Health Report</h2>
        <div class="rendered-content" id="health-report">
            <div class="content-placeholder">
                <span class="icon">&#x1FA7A;</span>
                <span class="text">Loading health report...</span>
            </div>
        </div>

        <h2 class="health-section-title">System Diagnostics</h2>
        <div class="doctor-section">
            <div class="doctor-meta" id="doctor-timestamp"></div>
            <pre id="doctor-output">Loading...</pre>
        </div>
    </main>

    <footer>
        <p>ludics v0.1 | <a href="https://github.com/lukstafi/ludics">GitHub</a></p>
    </footer>

    <script src="markdown.js"></script>
    <script>
        const CONFIG = {
            refreshInterval: 30000,
            dataPath: 'data/'
        };

        document.addEventListener('DOMContentLoaded', () => {
            fetchHealth();
            setInterval(fetchHealth, CONFIG.refreshInterval);
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                fetchHealth();
            }
        });

        async function fetchHealth() {
            try {
                const response = await fetch(CONFIG.dataPath + 'health.json');
                if (!response.ok) throw new Error('Failed to fetch health data');
                const data = await response.json();
                renderHealthReport(data.healthReport);
                renderDoctor(data.doctor);
                updateTimestamp();
                setConnectionStatus(true);
            } catch (error) {
                console.warn('Failed to fetch health data:', error);
                setConnectionStatus(false);
            }
        }

        function renderHealthReport(report) {
            const container = document.getElementById('health-report');
            if (!container) return;

            if (!report || !report.exists) {
                container.innerHTML = `
                    <div class="content-placeholder">
                        <span class="icon">&#x1FA7A;</span>
                        <span class="text">No health report available yet</span>
                        <span class="hint">Health reports are generated every 4 hours</span>
                    </div>
                `;
                return;
            }

            container.innerHTML = markdownToHtml(report.content);
        }

        function renderDoctor(doctor) {
            const output = document.getElementById('doctor-output');
            const timestamp = document.getElementById('doctor-timestamp');
            if (!output) return;

            if (doctor && doctor.output) {
                output.textContent = doctor.output;
            } else {
                output.textContent = 'No diagnostics available';
            }

            if (timestamp && doctor && doctor.timestamp) {
                const d = new Date(doctor.timestamp);
                timestamp.textContent = 'Last run: ' + d.toLocaleString();
            }
        }

        function updateTimestamp() {
            const el = document.getElementById('last-update');
            if (el) {
                el.textContent = `Last update: ${new Date().toLocaleTimeString()}`;
            }
        }

        function setConnectionStatus(connected) {
            const el = document.getElementById('connection-status');
            if (el) {
                el.className = connected ? 'connected' : 'disconnected';
                el.textContent = connected ? 'Connected' : 'Disconnected';
            }
        }
    </script>
</body>
</html>
