<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ludics Health</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .health-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
        }

        .health-section-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--accent);
        }

        .health-content {
            background-color: var(--bg-panel);
            border-radius: 8px;
            border: 1px solid var(--border);
            padding: 2rem;
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }

        .health-content h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .health-content h2 {
            font-size: 1.125rem;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: var(--accent);
        }

        .health-content h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .health-content p {
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        .health-content ul, .health-content ol {
            margin-bottom: 0.75rem;
            padding-left: 1.5rem;
        }

        .health-content li {
            margin-bottom: 0.375rem;
            color: var(--text-primary);
        }

        .health-content strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .health-content code {
            background-color: var(--bg-secondary);
            padding: 0.125rem 0.375rem;
            border-radius: 3px;
            font-size: 0.875rem;
        }

        .health-content pre {
            background-color: var(--bg-secondary);
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            margin-bottom: 0.75rem;
        }

        .health-content pre code {
            background-color: transparent;
            padding: 0;
        }

        .health-content table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 0.75rem;
            font-size: 0.875rem;
        }

        .health-content th {
            background-color: var(--bg-secondary);
            font-weight: 600;
            text-align: left;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
        }

        .health-content td {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
        }

        .health-content tr:nth-child(even) td {
            background-color: rgba(255,255,255,0.03);
        }

        .health-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            color: var(--text-secondary);
        }

        .health-placeholder .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .health-placeholder .text {
            font-size: 1rem;
            opacity: 0.7;
        }

        .health-placeholder .hint {
            font-size: 0.875rem;
            opacity: 0.5;
            margin-top: 0.5rem;
        }

        .doctor-section {
            background-color: var(--bg-panel);
            border-radius: 8px;
            border: 1px solid var(--border);
            padding: 1.5rem 2rem;
            margin-bottom: 1.5rem;
        }

        .doctor-meta {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
        }

        .doctor-section pre {
            background-color: var(--bg-secondary);
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            white-space: pre-wrap;
            font-size: 0.875rem;
            margin: 0;
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-links">
            <h1>ludics</h1>
            <a href="index.html">Dashboard</a>
            <a href="mag.html">Mag</a>
            <a href="#" id="t3code-link">t3code</a>
            <a href="terminals.html">Terminals</a>
            <a href="ntfy.html">ntfy</a>
            <a href="tasks.html">Tasks</a>
            <a href="briefing.html">Briefing</a>
            <a href="health.html" class="active">Health</a>
        </div>
        <div class="status-bar">
            <span id="last-update">Last update: --</span>
            <span id="connection-status" class="connected">Connected</span>
        </div>
    </header>
    <script src="nav.js"></script>

    <main class="health-container">
        <h2 class="health-section-title">Health Report</h2>
        <div class="health-content" id="health-report">
            <div class="health-placeholder">
                <span class="icon">&#x1FA7A;</span>
                <span class="text">Loading health report...</span>
            </div>
        </div>

        <h2 class="health-section-title">System Diagnostics</h2>
        <div class="doctor-section">
            <div class="doctor-meta" id="doctor-timestamp"></div>
            <pre id="doctor-output">Loading...</pre>
        </div>
    </main>

    <footer>
        <p>ludics v0.1 | <a href="https://github.com/lukstafi/ludics">GitHub</a></p>
    </footer>

    <script src="markdown.js"></script>
    <script>
        const CONFIG = {
            refreshInterval: 30000,
            dataPath: 'data/'
        };

        document.addEventListener('DOMContentLoaded', () => {
            fetchHealth();
            setInterval(fetchHealth, CONFIG.refreshInterval);
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                fetchHealth();
            }
        });

        async function fetchHealth() {
            try {
                const response = await fetch(CONFIG.dataPath + 'health.json');
                if (!response.ok) throw new Error('Failed to fetch health data');
                const data = await response.json();
                renderHealthReport(data.healthReport);
                renderDoctor(data.doctor);
                updateTimestamp();
                setConnectionStatus(true);
            } catch (error) {
                console.warn('Failed to fetch health data:', error);
                setConnectionStatus(false);
            }
        }

        function renderHealthReport(report) {
            const container = document.getElementById('health-report');
            if (!container) return;

            if (!report || !report.exists) {
                container.innerHTML = `
                    <div class="health-placeholder">
                        <span class="icon">&#x1FA7A;</span>
                        <span class="text">No health report available yet</span>
                        <span class="hint">Health reports are generated every 4 hours</span>
                    </div>
                `;
                return;
            }

            container.innerHTML = markdownToHtml(report.content);
        }

        function renderDoctor(doctor) {
            const output = document.getElementById('doctor-output');
            const timestamp = document.getElementById('doctor-timestamp');
            if (!output) return;

            if (doctor && doctor.output) {
                output.textContent = doctor.output;
            } else {
                output.textContent = 'No diagnostics available';
            }

            if (timestamp && doctor && doctor.timestamp) {
                const d = new Date(doctor.timestamp);
                timestamp.textContent = 'Last run: ' + d.toLocaleString();
            }
        }

        function updateTimestamp() {
            const el = document.getElementById('last-update');
            if (el) {
                el.textContent = `Last update: ${new Date().toLocaleTimeString()}`;
            }
        }

        function setConnectionStatus(connected) {
            const el = document.getElementById('connection-status');
            if (el) {
                el.className = connected ? 'connected' : 'disconnected';
                el.textContent = connected ? 'Connected' : 'Disconnected';
            }
        }
    </script>
</body>
</html>
