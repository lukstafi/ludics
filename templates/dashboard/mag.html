<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ludics Mag</title>
    <script>document.documentElement.dataset.theme=localStorage.getItem('ludics-theme')||'night'</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-links">
            <h1>ludics</h1>
            <a href="index.html">Dashboard</a>
            <a href="mag.html" class="active">Mag</a>
            <a href="#" id="t3code-link">t3code</a>
            <a href="terminals.html">Terminals</a>
            <a href="ntfy.html">ntfy</a>
            <a href="tasks.html">Tasks</a>
            <a href="briefing.html">Briefing</a>
        </div>
        <div class="status-bar">
            <span id="last-update">Last update: --</span>
            <span id="connection-status" class="connected">Connected</span>
        </div>
    </header>
    <script src="nav.js"></script>

    <main class="mag-layout">
        <div class="mag-terminal-container" id="terminal-container">
            <div class="mag-terminal-placeholder" id="terminal-placeholder">
                Loading terminal...
            </div>
        </div>
        <div class="mag-queue-panel">
            <div class="mag-queue-list" id="queue-list">
                <div class="mag-mag-queue-empty">Loading queue...</div>
            </div>
            <div class="mag-queue-form">
                <textarea id="queue-message" placeholder="Send a message to Mag..."></textarea>
                <button id="queue-send" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </main>

    <script>
        const CONFIG = {
            dataPath: 'data/',
            pollInterval: 5000
        };

        document.addEventListener('DOMContentLoaded', () => {
            fetchTerminalUrl();
            fetchQueue();
            setInterval(fetchQueue, CONFIG.pollInterval);
        });

        async function fetchTerminalUrl() {
            try {
                const response = await fetch(CONFIG.dataPath + 'mag.json');
                if (!response.ok) throw new Error('Failed to fetch mag data');
                const mag = await response.json();

                const container = document.getElementById('terminal-container');
                const placeholder = document.getElementById('terminal-placeholder');

                if (mag.terminal) {
                    placeholder.remove();
                    const iframe = document.createElement('iframe');
                    iframe.className = 'mag-terminal-iframe';
                    iframe.src = mag.terminal;
                    iframe.allow = 'clipboard-read; clipboard-write';
                    iframe.sandbox = 'allow-scripts allow-same-origin allow-popups allow-forms';
                    container.appendChild(iframe);

                    const el = document.getElementById('last-update');
                    if (el) {
                        el.textContent = `Last update: ${new Date().toLocaleTimeString()}`;
                    }
                    setConnectionStatus(true);
                } else {
                    placeholder.textContent = 'Mag terminal not available';
                    setConnectionStatus(true);
                }
            } catch (error) {
                console.warn('Failed to fetch terminal URL:', error);
                const placeholder = document.getElementById('terminal-placeholder');
                if (placeholder) {
                    placeholder.textContent = 'Mag terminal not available';
                }
                setConnectionStatus(false);
            }
        }

        async function fetchQueue() {
            try {
                const response = await fetch('/api/queue');
                if (!response.ok) return;
                const data = await response.json();
                renderQueue(data.pending || [], data.results || []);
            } catch {
                // Silently skip — don't break the terminal
            }
        }

        function renderQueue(pending, results) {
            const list = document.getElementById('queue-list');
            if (!list) return;

            if (pending.length === 0 && results.length === 0) {
                list.innerHTML = '<div class="mag-queue-empty">No activity</div>';
                return;
            }

            let html = '';

            if (pending.length > 0) {
                html += '<div class="mag-queue-section-title">Pending</div>';
                for (const item of pending) {
                    if (item.raw) {
                        html += `<div class="mag-queue-item"><span class="action">[malformed]</span> ${escapeHtml(String(item.raw).slice(0, 80))}</div>`;
                        continue;
                    }
                    const action = escapeHtml(String(item.action || 'unknown'));
                    const task = item.task ? ` <span>${escapeHtml(String(item.task))}</span>` : '';
                    const content = item.content ? `<div>${escapeHtml(String(item.content).slice(0, 120))}</div>` : '';
                    const ts = item.timestamp ? `<div class="timestamp">${escapeHtml(String(item.timestamp))}</div>` : '';
                    html += `<div class="mag-queue-item"><span class="action">[${action}]</span>${task}${content}${ts}</div>`;
                }
            }

            if (results.length > 0) {
                html += '<div class="mag-queue-section-title">Recent</div>';
                for (const item of results) {
                    if (item.error) {
                        html += `<div class="mag-queue-item"><span class="action">[parse error]</span></div>`;
                        continue;
                    }
                    const status = escapeHtml(String(item.status || 'unknown'));
                    const action = item.action ? escapeHtml(String(item.action)) : '';
                    const taskId = item.task_id ? escapeHtml(String(item.task_id)) : '';
                    // Build a human-readable description from available fields
                    let desc = '';
                    if (item.output) {
                        desc = String(item.output).slice(0, 140);
                    } else if (item.created != null && item.skipped != null) {
                        const tasks = Array.isArray(item.tasks) && item.tasks.length > 0
                            ? ': ' + item.tasks.join(', ') : '';
                        desc = `${action || 'suggestions'}: ${item.created} created, ${item.skipped} skipped${tasks}`;
                    } else if (item.critical != null) {
                        desc = `health: ${item.critical} critical, ${item.warnings || 0} warnings`;
                    } else if (item.proposal_path) {
                        const pName = String(item.proposal_path).split('/').pop() || item.proposal_path;
                        desc = `draft-proposal ${taskId} → ${escapeHtml(pName)}`;
                    } else if (action && taskId) {
                        desc = `${action} ${taskId} — ${status}`;
                    } else if (action) {
                        desc = `${action} — ${status}`;
                    } else if (taskId) {
                        desc = `${taskId} — ${status}`;
                    }
                    if (!desc) desc = status;
                    const ts = item.timestamp ? `<div class="timestamp">${escapeHtml(String(item.timestamp))}</div>` : '';
                    html += `<div class="mag-queue-item">${escapeHtml(desc)}${ts}</div>`;
                }
            }

            list.innerHTML = html;
        }

        async function sendMessage() {
            const textarea = document.getElementById('queue-message');
            const button = document.getElementById('queue-send');
            const content = textarea.value.trim();
            if (!content) return;

            button.disabled = true;
            try {
                const response = await fetch('/api/queue', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });
                if (response.ok) {
                    textarea.value = '';
                    fetchQueue();
                }
            } catch {
                // Silently handle network errors
            } finally {
                button.disabled = false;
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function setConnectionStatus(connected) {
            const el = document.getElementById('connection-status');
            if (!el) return;
            el.className = connected ? 'connected' : 'disconnected';
            el.textContent = connected ? 'Connected' : 'Disconnected';
        }

    </script>
</body>
</html>
