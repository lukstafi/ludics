<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ludics Notifications</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .ntfy-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0;
            min-height: 0;
        }

        .ntfy-iframe {
            flex: 1;
            width: 100%;
            border: none;
            min-height: 0;
        }

        .ntfy-placeholder {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-links">
            <h1>ludics</h1>
            <a href="index.html">Dashboard</a>
            <a href="terminal.html">Mag</a>
            <a href="#" id="t3code-link">t3code</a>
            <a href="terminals.html">Terminals</a>
            <a href="ntfy.html" class="active">ntfy</a>
            <a href="tasks.html">Tasks</a>
            <a href="briefing.html">Briefing</a>
        </div>
        <div class="status-bar">
            <span id="last-update">Last update: --</span>
            <span id="connection-status" class="connected">Connected</span>
        </div>
    </header>

    <main class="ntfy-container" id="ntfy-container">
        <div class="ntfy-placeholder" id="ntfy-placeholder">
            Loading ntfy...
        </div>
    </main>

    <script>
        const CONFIG = {
            dataPath: 'data/'
        };

        document.addEventListener('DOMContentLoaded', () => {
            fetchNtfyUrl();
        });

        async function fetchNtfyUrl() {
            try {
                const response = await fetch(CONFIG.dataPath + 'ntfy.json');
                if (!response.ok) throw new Error('Failed to fetch ntfy data');
                const ntfy = await response.json();

                const container = document.getElementById('ntfy-container');
                const placeholder = document.getElementById('ntfy-placeholder');

                if (ntfy.appUrl) {
                    placeholder.remove();
                    const iframe = document.createElement('iframe');
                    iframe.className = 'ntfy-iframe';
                    iframe.src = ntfy.appUrl;
                    iframe.allow = 'clipboard-read; clipboard-write; notifications';
                    container.appendChild(iframe);

                    const el = document.getElementById('last-update');
                    if (el) {
                        el.textContent = `Last update: ${new Date().toLocaleTimeString()}`;
                    }
                    setConnectionStatus(true);
                } else {
                    placeholder.textContent = 'ntfy app not configured';
                    setConnectionStatus(true);
                }
            } catch (error) {
                console.warn('Failed to fetch ntfy URL:', error);
                const placeholder = document.getElementById('ntfy-placeholder');
                if (placeholder) {
                    placeholder.textContent = 'ntfy app not available';
                }
                setConnectionStatus(false);
            }
        }

        function setConnectionStatus(connected) {
            const el = document.getElementById('connection-status');
            if (!el) return;
            el.className = connected ? 'connected' : 'disconnected';
            el.textContent = connected ? 'Connected' : 'Disconnected';
        }

    </script>
    <script src="adapter-link.js"></script>
</body>
</html>
