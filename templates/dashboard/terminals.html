<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ludics Terminals</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .terminal-grid {
            display: flex; flex-direction: column;
            gap: 4px; padding: 8px;
        }
        .terminal-pair {
            display: flex; gap: 4px;
            min-height: 50vh; flex-shrink: 0;
        }
        .terminal-cell {
            flex: 1; display: flex; flex-direction: column;
            border: 1px solid #333; border-radius: 4px; overflow: hidden;
        }
        .terminal-label {
            background: #1a1a2e; color: #8be9fd;
            padding: 4px 8px; font-size: 12px; font-family: monospace;
        }
        .terminal-frame {
            flex: 1; border: none; width: 100%; min-height: 45vh;
            background: #0d1117;
        }
        .terminal-cell.inactive .terminal-label { opacity: 0.4; }
        .terminal-cell.inactive .terminal-frame { display: none; }
        .terminal-cell.inactive::after {
            content: 'No session'; display: flex; align-items: center;
            justify-content: center; flex: 1; color: #555; font-family: monospace;
        }
        .terminal-grid.error::after {
            content: attr(data-error); display: flex; align-items: center;
            justify-content: center; padding: 2rem; color: #f55;
            font-family: monospace; font-size: 14px; white-space: pre-line;
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-links">
            <h1>ludics</h1>
            <a href="index.html">Dashboard</a>
            <a href="terminal.html">Mag</a>
            <a href="terminals.html" class="active">Terminals</a>
            <a href="ntfy.html">ntfy</a>
            <a href="tasks.html">Tasks</a>
            <a href="briefing.html">Briefing</a>
        </div>
        <div class="status-bar">
            <span id="last-update">Last update: --</span>
            <span id="connection-status" class="connected">Connected</span>
        </div>
    </header>
    <script src="nav.js"></script>
    <div class="terminal-grid">
        <!-- Populated by JS from data/terminals.json -->
    </div>
    <script>
        function showError(msg) {
            const grid = document.querySelector('.terminal-grid');
            grid.classList.add('error');
            grid.dataset.error = msg;
        }
        function clearError() {
            const grid = document.querySelector('.terminal-grid');
            grid.classList.remove('error');
            delete grid.dataset.error;
        }
        async function loadTerminals() {
            try {
                const resp = await fetch('data/terminals.json');
                if (!resp.ok) {
                    showError(`Failed to load terminals: ${resp.status} ${resp.statusText}`);
                    return;
                }
                const data = await resp.json();
                clearError();
                renderTerminals(data.terminals || [], data.activeSlots || []);
                document.getElementById('last-update').textContent =
                    'Last update: ' + new Date().toLocaleTimeString();
            } catch (err) {
                showError(`Failed to connect to dashboard data:\n${err.message}`);
            }
        }
        function renderTerminals(terminals, activeSlots) {
            const grid = document.querySelector('.terminal-grid');
            // Build on first render, then update in-place to avoid iframe reconnects
            const isFirstRender = grid.children.length === 0;
            for (let slot = 1; slot <= 6; slot++) {
                let pair;
                if (isFirstRender) {
                    pair = document.createElement('div');
                    pair.className = 'terminal-pair';
                    pair.dataset.slot = slot;
                    grid.appendChild(pair);
                } else {
                    pair = grid.children[slot - 1];
                }
                const slotActive = activeSlots.includes(slot);
                for (let ri = 0; ri < 2; ri++) {
                    const role = ri === 0 ? 'coder' : 'reviewer';
                    const entry = terminals.find(
                        t => t.slot === slot && t.role === role
                    );
                    if (!entry) continue;
                    const port = entry.port;
                    const host = entry.host;
                    const active = slotActive && entry.active !== false;
                    const src = `http://${host}:${port}`;
                    const cellId = `cell-${slot}-${role}`;

                    let cell = document.getElementById(cellId);
                    if (!cell) {
                        cell = document.createElement('div');
                        cell.id = cellId;
                        pair.appendChild(cell);
                    }

                    const prevActive = cell.dataset.active === 'true';
                    const prevSrc = cell.dataset.src || '';

                    // Only rebuild cell content if active state or URL changed
                    if (prevActive === active && prevSrc === src) {
                        continue;
                    }

                    cell.dataset.active = active;
                    cell.dataset.src = src;
                    cell.className = 'terminal-cell' + (active ? '' : ' inactive');
                    cell.innerHTML = active
                        ? `<div class="terminal-label">Slot ${slot} ${role} (:${port})</div>
                           <iframe class="terminal-frame" src="${src}" loading="lazy"
                                   allow="clipboard-read; clipboard-write"
                                   sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>`
                        : `<div class="terminal-label">Slot ${slot} ${role} (:${port})</div>`;
                }
            }
        }
        loadTerminals();
        setInterval(loadTerminals, 30000);
    </script>
</body>
</html>
