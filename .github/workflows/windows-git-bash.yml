name: windows git bash

# ship-pr's shell suites under Git for Windows' MINGW64 bash on windows-latest (ludics-lite#318),
# nightly and on demand. Not per push (ludics-lite#339): the job runs over an hour, and neither
# a pull request's checks nor main's verdict (`pr-review.sh base` folds push runs only) waits on it.
# A dispatched run does put check runs on the head it ran at, so `checks`/`merge` judge it there.
#
# Windows evidence for a branch whose change needs it, not for every scripts PR: `gh workflow run
# windows-git-bash.yml --ref <branch>`, or `-f suite=test-pr-review-watch.sh` for one suite; cite
# the run. A scheduled red opens (or comments on) one issue.
#
# The first step proves the shell from inside it (`uname -s` MINGW*/MSYS*, `git --version`
# `.windows.`, the criterion ludics-lite#288 states for a Windows leg) and every suite is gated on
# it. Every `ship-pr/scripts/test-*.sh` has a run line in the `git-bash` job here, which
# `scripts/check-prompts.sh` holds. KNOWN RED steps (`continue-on-error: true`) still run, fail
# and annotate, with the issue that removes the line named at the step. Not run here: the Python
# fixtures (the hostile pass is Ubuntu-only by design) and the repo and fleet suites, which are
# not ship-pr code (the fleet launcher needs tmux, which Git for Windows does not ship). One
# exception: the prompt checker's suite, ported off bash under ludics-lite#403, runs last.

on:
  schedule:
    # Away from api-contract.yml (05:23) and base-watch.yml (06:47).
    - cron: '11 3 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: One ship-pr suite by file name (e.g. test-pr-review-watch.sh), or test_checkprompts_cli.py; empty runs all
        required: false
        default: ''

permissions:
  contents: read

jobs:
  git-bash:
    name: Git Bash suites, ship-pr (windows)
    runs-on: windows-latest
    # The cleanup step is capped at 30 below. Since ludics-lite#335 the jq-reading suites run their
    # whole case lists here instead of stopping at a CRLF read (base-settle 10s -> 115s,
    # checks-absent 39s -> 350s) and the lib's CRLF controls add about 3 minutes; 60 minutes cut
    # run 36031359850 off inside the watch suite, at 60 of an estimated ~68. Since ludics-lite#338
    # the cleanup suite runs every case whole, about 5 minutes more (~73).
    timeout-minutes: 90
    defaults:
      run:
        # On a Windows runner `bash` is Git for Windows' bash (C:\Program Files\Git\bin\bash.exe),
        # not WSL's. The proof step below is what holds that, not this comment.
        shell: bash
    steps:
      # The image's Git carries core.autocrlf=true, and before .gitattributes pinned `eol=lf` this
      # checkout was CRLF; the proof step prints the setting and pr-review.sh's first line in bytes.
      - uses: actions/checkout@v4
      # The fleet's pinned jq, as a native jq.exe, ahead of the image's Chocolatey one
      # (ludics-lite#508); the proof step below records its version and its line ending.
      - uses: ./.github/actions/setup-jq
      # The subcommands ported to Python run through scripts/py, which needs a Python >= 3.12
      # (ludics-lite#403); on Windows it finds `python`, or the `py` launcher.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove the platform from inside the suites' shell
        id: platform
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          os=$(uname -s)
          gv=$(git --version)
          echo "uname -s:      $os"
          echo "git --version: $gv"
          echo "bash:          ${BASH_VERSION:-?} at ${BASH:-?}"
          echo "core.autocrlf: $(git config --show-origin --get core.autocrlf || echo unset)"
          head -n 1 ship-pr/scripts/pr-review.sh | od -c | head -n 2
          case "$os" in
          MINGW* | MSYS*) ;;
          *) echo "::error title=Git Bash platform proof failed::uname -s is '$os', not MINGW*/MSYS*"; exit 1 ;;
          esac
          case "$gv" in
          *.windows.*) ;;
          *) echo "::error title=Git Bash platform proof failed::git --version is '$gv', not a Git for Windows build (.windows.)"; exit 1 ;;
          esac
          command -v jq || { echo '::error title=Git Bash platform proof failed::no jq on PATH'; exit 1; }
          scripts/py -c 'import sys; print("scripts/py:     Python", sys.version.split()[0], "at", sys.executable)' ||
            { echo '::error title=Git Bash platform proof failed::scripts/py found no Python >= 3.12'; exit 1; }
          # The pinned jq is a native jq.exe, which ends its lines CRLF, and a `$(jq -r ...)`
          # keeps the \r; the suites read every jq through pr-review.sh's `jq_lf`, which probes for that once
          # (ludics-lite#335). Recorded here, so the day it changes is on the record.
          echo "jq:            $(jq --version), and jq -r ends a line with: $(printf '"x"' | jq -r . | od -An -c | tr -s ' ')"
          # A suite name that matches no step would skip them all and read green.
          case "$SUITE" in
          '' | test_checkprompts_cli.py) ;;
          test-*.sh) [ -f "ship-pr/scripts/$SUITE" ] || { echo "::error title=No such suite::ship-pr/scripts/$SUITE does not exist"; exit 1; } ;;
          *) echo "::error title=No such suite::suite takes a ship-pr/scripts/test-*.sh file name, got '$SUITE'"; exit 1 ;;
          esac
      # Every suite step below runs whether or not an earlier suite failed, but only once the
      # proof passed, and only the named suite when one was dispatched; a failure names its suite
      # in the run's annotations.
      - name: post-merge cleanup
        # Green here since ludics-lite#338. What this platform cannot express is a stated boundary,
        # never an excluded case: a case prints `SKIP <case>: <the MSYS mechanism>` and the summary
        # line counts and names those cases (7 on the run that landed it: control characters in
        # file names, a directory held as a live process's working directory, a mode bit MSYS does
        # not keep). The suite sets MSYS=winsymlinks:nativestrict itself, so its symlink cases
        # test native links here.
        id: cleanup
        # The suite ends on its own here since ludics-lite#337 (its per-case deadline fires under
        # MSYS, and it prints its summary). 846s at -j 4 while 21 cases failed early; 1146s once
        # #338 let them run whole. The cap is the backstop for a runner that stops making
        # progress, not the suite's end.
        timeout-minutes: 30
        if: ${{ !cancelled() && steps.platform.outcome == 'success' && (!inputs.suite || inputs.suite == 'test-post-merge-cleanup.sh') }}
        env:
          SHIP_PR_TEST_LOG_DIR: ${{ runner.temp }}/cleanup-logs
        run: ship-pr/scripts/test-post-merge-cleanup.sh || { echo '::error title=Git Bash suite failed::test-post-merge-cleanup.sh'; exit 1; }
      - name: pr-review fixtures, shared preamble and shadow guard
        if: ${{ !cancelled() && steps.platform.outcome == 'success' && (!inputs.suite || inputs.suite == 'test-pr-review-lib.sh') }}
        run: ship-pr/scripts/test-pr-review-lib.sh || { echo '::error title=Git Bash suite failed::test-pr-review-lib.sh'; exit 1; }
      - name: pr-review fixtures, the base suites' shared fixture transport
        if: ${{ !cancelled() && steps.platform.outcome == 'success' && (!inputs.suite || inputs.suite == 'test-pr-review-base-lib.sh') }}
        run: ship-pr/scripts/test-pr-review-base-lib.sh || { echo '::error title=Git Bash suite failed::test-pr-review-base-lib.sh'; exit 1; }
      - name: pr-review fixtures, base drift
        if: ${{ !cancelled() && steps.platform.outcome == 'success' && (!inputs.suite || inputs.suite == 'test-pr-review-base-drift.sh') }}
        run: ship-pr/scripts/test-pr-review-base-drift.sh || { echo '::error title=Git Bash suite failed::test-pr-review-base-drift.sh'; exit 1; }
      - name: pr-review fixtures, the base command's red report
        if: ${{ !cancelled() && steps.platform.outcome == 'success' && (!inputs.suite || inputs.suite == 'test-pr-review-base-red.sh') }}
        run: ship-pr/scripts/test-pr-review-base-red.sh || { echo '::error title=Git Bash suite failed::test-pr-review-base-red.sh'; exit 1; }
      - name: pr-review fixtures, the paths-ignore settle
        if: ${{ !cancelled() && steps.platform.outcome == 'success' && (!inputs.suite || inputs.suite == 'test-pr-review-base-settle.sh') }}
        run: ship-pr/scripts/test-pr-review-base-settle.sh || { echo '::error title=Git Bash suite failed::test-pr-review-base-settle.sh'; exit 1; }
      - name: pr-review fixtures, what the base wait loop decides
        if: ${{ !cancelled() && steps.platform.outcome == 'success' && (!inputs.suite || inputs.suite == 'test-pr-review-base-verdict.sh') }}
        run: ship-pr/scripts/test-pr-review-base-verdict.sh || { echo '::error title=Git Bash suite failed::test-pr-review-base-verdict.sh'; exit 1; }
      - name: pr-review fixtures, the named sources of a tip no push run judges
        if: ${{ !cancelled() && steps.platform.outcome == 'success' && (!inputs.suite || inputs.suite == 'test-pr-review-base-pushless.sh') }}
        run: ship-pr/scripts/test-pr-review-base-pushless.sh || { echo '::error title=Git Bash suite failed::test-pr-review-base-pushless.sh'; exit 1; }
      - name: pr-review fixtures, absent vs not yet
        if: ${{ !cancelled() && steps.platform.outcome == 'success' && (!inputs.suite || inputs.suite == 'test-pr-review-checks-absent.sh') }}
        run: ship-pr/scripts/test-pr-review-checks-absent.sh || { echo '::error title=Git Bash suite failed::test-pr-review-checks-absent.sh'; exit 1; }
      - name: pr-review fixtures, review rounds
        if: ${{ !cancelled() && steps.platform.outcome == 'success' && (!inputs.suite || inputs.suite == 'test-pr-review-rounds.sh') }}
        run: ship-pr/scripts/test-pr-review-rounds.sh || { echo '::error title=Git Bash suite failed::test-pr-review-rounds.sh'; exit 1; }
      - name: pr-review fixtures, merge
        if: ${{ !cancelled() && steps.platform.outcome == 'success' && (!inputs.suite || inputs.suite == 'test-pr-review-merge.sh') }}
        run: ship-pr/scripts/test-pr-review-merge.sh || { echo '::error title=Git Bash suite failed::test-pr-review-merge.sh'; exit 1; }
      - name: pr-review fixtures, status and watch
        if: ${{ !cancelled() && steps.platform.outcome == 'success' && (!inputs.suite || inputs.suite == 'test-pr-review-status.sh') }}
        run: ship-pr/scripts/test-pr-review-status.sh || { echo '::error title=Git Bash suite failed::test-pr-review-status.sh'; exit 1; }
      - name: pr-review fixtures, what ends a watch
        if: ${{ !cancelled() && steps.platform.outcome == 'success' && (!inputs.suite || inputs.suite == 'test-pr-review-watch.sh') }}
        run: ship-pr/scripts/test-pr-review-watch.sh || { echo '::error title=Git Bash suite failed::test-pr-review-watch.sh'; exit 1; }
      - name: pr-review fixtures, the folded reply and resolve
        if: ${{ !cancelled() && steps.platform.outcome == 'success' && (!inputs.suite || inputs.suite == 'test-pr-review-reply.sh') }}
        run: ship-pr/scripts/test-pr-review-reply.sh || { echo '::error title=Git Bash suite failed::test-pr-review-reply.sh'; exit 1; }
      - name: pr-review fixtures, the plain retry and the run await
        if: ${{ !cancelled() && steps.platform.outcome == 'success' && (!inputs.suite || inputs.suite == 'test-pr-review-retry.sh') }}
        run: ship-pr/scripts/test-pr-review-retry.sh || { echo '::error title=Git Bash suite failed::test-pr-review-retry.sh'; exit 1; }
      - name: pr-review fixtures, the polling budget
        if: ${{ !cancelled() && steps.platform.outcome == 'success' && (!inputs.suite || inputs.suite == 'test-pr-review-budget.sh') }}
        run: ship-pr/scripts/test-pr-review-budget.sh || { echo '::error title=Git Bash suite failed::test-pr-review-budget.sh'; exit 1; }
      - name: pr-review fixtures, the live-API contract's own logic
        if: ${{ !cancelled() && steps.platform.outcome == 'success' && (!inputs.suite || inputs.suite == 'test-pr-review-api-contract.sh') }}
        run: ship-pr/scripts/test-pr-review-api-contract.sh || { echo '::error title=Git Bash suite failed::test-pr-review-api-contract.sh'; exit 1; }
      - name: prompt checker fixtures
        # A unittest module of the package, run through scripts/py (ludics-lite#403). What the
        # native Windows interpreter cannot set up -- a symbolic link, a backslash or a tab in a
        # file name, a mode of 000 -- is a case skipped with that reason, never a case left out.
        if: ${{ !cancelled() && steps.platform.outcome == 'success' && (!inputs.suite || inputs.suite == 'test_checkprompts_cli.py') }}
        run: scripts/py -m unittest ludics.tests.test_checkprompts_cli || { echo '::error title=Git Bash suite failed::test_checkprompts_cli.py'; exit 1; }
      - name: Keep the cleanup suite's per-case logs
        if: failure() || cancelled() || steps.cleanup.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-logs-git-bash
          path: ${{ runner.temp }}/cleanup-logs
          if-no-files-found: ignore

  report:
    name: report a red nightly run
    # A scheduled run nobody watches fails silently. One open issue, not one per night: a later red
    # comments on it. No checkout, since this job's token can write. Known-red steps do not turn
    # the job red, so this fires on a new failure or a job that did not finish.
    needs: git-bash
    if: ${{ !cancelled() && github.event_name == 'schedule' && needs.git-bash.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or extend the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.git-bash.result }}
        run: |
          set -e
          title="windows git bash: the nightly run of ship-pr's suites under Git Bash is red"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Still red on $(date -u +%Y-%m-%d) ($RESULT): $run_url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "The scheduled \`windows-git-bash.yml\` run on main concluded $RESULT at $GITHUB_SHA: $run_url. Its annotations name each failed suite."
          fi
