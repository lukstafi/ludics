name: skill scripts

# The prompts and the shell behind the skills, on the platforms the fleet runs: Ubuntu, macOS, and
# Windows (PowerShell for the bounded driver; Git Bash is windows-git-bash.yml). Every push to
# main or v2 and every pull request runs it. v2 is the Python rewrite's integration branch
# (ludics-lite#403): without its push runs, the fleet's base gate (`pr-review.sh base`) would
# read NO VERDICT on v2 forever. One job per concern, so a new one (a scheduled contract
# check, say) is one more entry below and no edit to the others.
#
# THE VERDICT GUARANTEE. `pr-review.sh merge` reads the head commit's check-runs and refuses a
# head that has none (ABSENT, ludics-lite#21). Two jobs therefore run on every head, whatever it
# changed: `prompts` (the small guards: the prompt hygiene checks, the sync-routines suite, which
# is unconditional for a second reason given at the job itself, and three suites too cheap to
# condition) and `lint`. Everything expensive is conditioned on the diff instead -- as job-level
# `if:` conditions on a `changes` job, NEVER as
# `on.<event>.paths`: a workflow-level path filter means no run at all for a prompt-only PR, so
# no verdict; a job that its `if:` skips still reports a `skipped` check-run, which the gate
# reads as green (nothing failed) next to the small guards' `success` (something ran and
# passed, which `--require-green` asks for). Adding a job that must always judge: leave its
# `if:` out. Adding a job that is expensive: give it the `needs: changes` / `if:` pair below.
#
# THE MACOS QUEUE. macOS coverage is required (the fleet's bash is 3.2), but the hosted macOS
# runners are scarce: with one macOS job per suite, each waited for its own runner assignment
# and a green PR sat one to two hours behind ~9 minutes of actual work (ludics-lite#55). So every
# macOS suite is one step of ONE macOS job, which installs the shared dependencies once; each
# step still runs after an earlier one fails (`if: !cancelled()`), still names its suite when it
# fails (the `::error` annotation), and the job is red if any step is. Those annotations are a
# device of the jobs of that shape: the macOS jobs, the two Ubuntu jobs that gather independent
# checks into one runner (`prompts` and `pr-review-hostile`), and windows-git-bash.yml's
# `git-bash` job (one Windows runner, every ship-pr suite a step of it). That `if:` is the whole
# reason for them: with every suite running whatever the suite before it did, one red job of that
# shape can hold several failures spread across its steps, and the annotation is what names them
# without reading the log. The other Ubuntu jobs run several suites as steps too (`pr-review`,
# `lint`), but a suite that fails there stops the job it is in, leaving a single red step to
# find. ludics-lite#266 is about holding the `!cancelled()`/annotation pairing mechanically rather
# than by reading this paragraph.
#
# THE CAPS. A job that crosses its `timeout-minutes` concludes cancelled, with no verdict, however
# green its steps were, and costs a re-run (ludics-lite#474). So every cap is at least
# max(5, ceil(1.5 x p90)) minutes, the p90 taken over the job's successful runs on main and on
# pull requests (for a job formed by moving steps, the sum of those steps); a cap above that
# floor gives its own reason at the job. The runs measured are listed in ludics-lite#474's PR.
# Re-measure with `gh run view <id> --json jobs` rather than trusting a figure written here.

on:
  pull_request:
  push:
    branches: [main, v2]

permissions:
  contents: read

# One run per pull request. A pull request's new push supersedes its previous run instead of
# stacking behind it: nobody merges the head that run was judging. Pushes to a branch (main, v2)
# share that branch's group without cancel-in-progress, so the next verdict is at the merged tip
# (ludics-lite#597, the maintainer's decision of 2026-10-12): GitHub never cancels a RUNNING run
# in the group, and a newer push cancels only the PENDING one waiting behind it, so a burst of
# merges leaves at most two runs, the one going and one for the newest tip. That is GitHub's
# default `queue: single` ("At most one job or workflow run can be `pending` in the concurrency
# group"), left implicit because actionlint 1.7.12 refuses the key; `queue: max` would bring back
# a run per merge. A merge whose run was cancelled pending is judged by the next run, as part of
# a span; a red over a span is attributed, then bisected, by the integration loop (issue-wave's
# SKILL.md, *Roll-forward merges and the integration loop*), which also says what to do in the
# one race this leaves: GitHub orders waiting runs by when each started waiting, without a
# guarantee, so two pushes racing in can leave the tip with only a cancelled run. The history
# this replaces:
# - Grouped per ref WITH cancel-in-progress, each of seven merges on 2026-10-01 cancelled the run
#   before, RUNNING or not: main had no verdict for about three hours, and a cross-PR red (#91 x
#   #472) surfaced only on the first main run that finished. That is the failure this group does
#   not have: it never cancels a running run.
# - So #511 keyed main's group on the commit, one run per merge. A burst of N merges then queued N
#   pairs of macOS jobs (THE MACOS QUEUE above) before the tip got a verdict: nine merges on
#   2026-10-12 waited 2 h 45 min for a green tip, and the base gate's interim was refused for the
#   whole span, with an older merge's run always still going.
# `pr-review.sh base` reads a cancelled run as stopped, not judged: never a red, never a verdict,
# and the newest JUDGED run under it speaks (test-pr-review-base-verdict.sh pins the burst).
concurrency:
  group: skill-scripts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---- always run: the verdict every head carries -----------------------------------------

  prompts:
    name: small guards (ubuntu)
    # The prompt hygiene checks and every Ubuntu suite that finishes in seconds to a couple of
    # minutes, on one runner rather than one each (ludics-lite#474): they were five jobs, each
    # paying its own runner setup for a step shorter than that setup. No `if:` and no `needs:` on
    # this job, ever: it is the check-run a prompt-only head is judged by, and the sync-routines
    # pin below must run on exactly such a head. The three suites that used to be conditioned on
    # the diff (the ship-pr nudge, the prompt checker fixtures, the base negative-control helper)
    # run on every head here instead: conditioning a step needs `needs: changes`, which the job may
    # not carry, and together they add about two minutes to a prompt-only head's slowest check.
    # Every step after the first runs whatever the one before did, and names its suite on failure,
    # so one red guard does not hide another's verdict as it could not when they were five jobs.
    # The first carries neither: check-prompts.sh is pinned as a BARE invocation
    # (scripts/test-preflight.sh), and it writes its own `::error` annotations.
    # scripts/preflight.sh runs the others as its GUARDS (`preflight.sh guards`; the Markdown-
    # triggered ones by default, all under `--guards all`, ludics-lite#553), and
    # scripts/test-preflight.sh holds its guard table and this job's steps to one set: a suite
    # added here and not there fails it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check every SKILL.md's frontmatter and the README index tables
        run: scripts/check-prompts.sh
      - name: Reporter guards and fallback rendering
        # Execute the actual embedded shells with a fake gh; keep reporter vocabulary local.
        if: ${{ !cancelled() }}
        run: python3 scripts/test-workflow-reporters.py || { echo '::error title=suite failed::test-workflow-reporters.py'; exit 1; }
      - name: Exercise the routine install states and the routines-table pin
        # Unconditional for the routines-table pin it carries. A PR that adds or relabels a local
        # scheduled task can be entirely Markdown -- routines/README.md plus a prompt -- which the
        # classification below calls prompt-only. Conditioned like the other suites, the one check
        # that compares the table with the script's LOCAL_ROUTINES would be skipped on exactly the
        # PRs that can break it, and check-prompts.sh does not compare them (its index claim is a
        # per-directory lookup, ludics-lite#75, and is not to be grown into one). The suite holds
        # this job to that: it refuses an `if:` or `needs:` on the job that runs it. Growth alone
        # is not an argument for conditioning it: any condition cheap enough to be worth adding
        # would reopen exactly the all-Markdown gap the pin exists to close. Its macOS leg
        # stays in the conditioned macos-repo job below: bash 3.2 coverage is the expensive half,
        # and the pin itself is platform-independent.
        if: ${{ !cancelled() }}
        run: scripts/test-sync-routines.sh || { echo '::error title=suite failed::test-sync-routines.sh'; exit 1; }
      - name: Exercise the ship-pr nudge hook
        if: ${{ !cancelled() }}
        run: python3 ship-pr/hooks/test-ship-pr-nudge.py || { echo '::error title=suite failed::test-ship-pr-nudge.py'; exit 1; }
      - name: Exercise run-against-base.sh against a scratch repo
        if: ${{ !cancelled() }}
        run: scripts/test-run-against-base.sh || { echo '::error title=suite failed::test-run-against-base.sh'; exit 1; }
      - name: Exercise the hygiene checks against defective scratch trees
        if: ${{ !cancelled() }}
        run: scripts/test-check-prompts.sh || { echo '::error title=suite failed::test-check-prompts.sh'; exit 1; }
      - name: Exercise the Python interpreter wrapper
        # scripts/py, which every Python entry point of the v2 rewrite runs through (ludics-lite
        # #403): seconds, and it is what the other Python steps stand on.
        if: ${{ !cancelled() }}
        run: scripts/test-py.sh || { echo '::error title=suite failed::test-py.sh'; exit 1; }

  lint:
    name: syntax, shellcheck, mode bits, parse guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jq
      # THE FIVE ASSERTIONS BELOW LIVE IN scripts/preflight.sh (ludics-lite#123, #221). They were
      # inline `run:` blocks here, which made this job the one part of the repo held to neither of
      # the conventions it polices -- no fixture could reach them, the shell in them was the only
      # shell nothing lints, and the list of files they sweep was spelled three times on this
      # screen and a fourth time in the scratch buffer of whoever was pre-flighting a push by
      # hand. The script is that same list once and those same assertions; CI and the local loop
      # are now one command, and the reasoning each block carried travelled with its code -- read
      # the script rather than restating it here.
      #
      # --require-tools is what keeps this side fail-closed. Locally a missing shellcheck or pwsh
      # is a named SKIP, so the preflight stays runnable on a fleet mac; here it is a red step, so
      # an image that stops shipping one cannot pass as green.
      - name: Check shell syntax
        run: scripts/preflight.sh --require-tools syntax
      - name: Check the mode bit
        run: scripts/preflight.sh --require-tools modes
      - name: Shellcheck
        run: scripts/preflight.sh --require-tools shellcheck
      - name: Check PowerShell syntax
        run: scripts/preflight.sh --require-tools powershell
      - name: Check the jq version
        # The fleet runs jq 1.8, which parses `A and X as $b | B` differently from the 1.7.1
        # Ubuntu's apt carries (ludics-lite#508). Here it judges the pinned jq the step above put
        # first on PATH, under --require-tools, where another minor is red rather than the
        # warning it is at a fleet prompt: what CI pins and what the check accepts cannot part.
        run: scripts/preflight.sh --require-tools jq-version
      - name: Parse guard
        # Every `test-*.sh` suite is one brace group ending in `exit "$?"` and `}`
        # (ludics-lite#10, #247), so a mid-run rewrite cannot resume the shell at a shifted
        # offset. This step was two files named inline; the scan reads the same globs
        # check-prompts.sh walks for the register, so a suite added to any skill is judged
        # without a line here, and the non-test scripts that carry it -- post-merge-cleanup.sh,
        # which #10 armored, and #437's long-running fleet scripts -- are named in the script's
        # own ALSO_GUARDED list. The cost of the shape is that a
        # command appended past the closing brace is never read, and that failure is silent;
        # this is the guard on the guard. In the lint job, like the two below, so it judges
        # every head including a prompt-only one. #247 landed it as a script while ludics-lite#221
        # was in review, so preflight.sh runs it as one of its external steps rather than carrying
        # an assertion of its own; the step table and this job are pinned against each other.
        run: scripts/check-parse-guards.sh
      - name: Parse guard fixtures
        run: scripts/test-check-parse-guards.sh
      - name: jq shape guard
        # jq's `capture` yields ZERO outputs when it does not match, and a zero-output
        # sub-expression deletes the value around it rather than defaulting -- silently, with no
        # error anywhere and nothing for a test to catch. Five such sites have been fixed across
        # three PRs (ludics-lite#84 three, #104 a fourth, #89 a fifth) while the safe shape lived
        # only in prose. The guard refuses a `capture(` that is not `[capture(...)] | first`; its own
        # fixtures run beside it, since a scan that cannot fail would prove nothing. Both are in
        # the lint job so they judge every head, including a prompt-only one. With no argument it
        # sweeps `*/scripts/*.sh` and `scripts/*.sh` -- its own restatement of the file list the
        # steps above take from scripts/preflight.sh, less ship-pr/hooks and two files it excludes
        # by name (itself and its fixtures, which quote the refused shapes on purpose). That
        # restatement is ludics-lite#246; a script added to any skill is scanned without a line
        # here either way.
        run: scripts/check-jq-shapes.sh
      - name: jq shape guard fixtures
        run: scripts/test-check-jq-shapes.sh
      - name: scratch directory guard
        # `mktemp -d` answers with the path as the environment spells it, and on macOS /var and
        # /tmp are symlinks into /private, while every script here computes its own root with
        # `pwd -P`. Unresolved, one directory has two spellings: an assertion comparing a script's
        # output against a scratch path stops matching in silence, and the "must NOT appear" half
        # passes over anything. The one-line fix was independently rediscovered three times
        # (ludics-lite#208), because the absence of the line is not visible in the file that lacks
        # it. Here rather than in a suite, and in the lint job, for the same reason the jq guard
        # is: it judges every head, prompt-only ones included, and a new script in any skill is
        # scanned without a line here.
        run: scripts/check-scratch-dirs.sh
      - name: scratch directory guard fixtures
        run: scripts/test-check-scratch-dirs.sh
      - name: preflight fixtures
        # The controls for the five steps above, and the pin that keeps this job and the script
        # the same set of checks: a step added here and not to the script's table fails it.
        run: scripts/test-preflight.sh

  # ---- the diff classification the suites are conditioned on ------------------------------

  changes:
    name: classify the diff
    # Pull requests only: a push to main runs every suite regardless (the consumers' `if:`
    # below treats any other event as "scripts changed"), so main's verdict is always the full
    # one and the runtimes measured there are the whole workflow's.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the PR's file list comes from the API; no checkout needed
    outputs:
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # "Script-related" is defined by its complement: a PR is prompt-only when every file it
          # touches is Markdown other than the top-level README. The README counts as script
          # input because the fleet launcher's suite extracts and executes its install loops.
          # Patterns are OR-ed (dorny's default `some` quantifier), so the two lines read: any
          # non-Markdown file, plus README.md. A rename needs no line of its own: on a pull
          # request the action expands one into a delete of the previous path and an add of
          # the new (src/main.ts, "Rename is replaced by delete of original filename and add
          # of new filename"), so a script renamed to a Markdown path is classified by the
          # script path it left.
          filters: |
            scripts:
              - '!**/*.md'
              - 'README.md'

  # ---- the expensive script suites on Ubuntu, one job per concern -------------------------
  # Each carries the same `needs`/`if` pair: run on any event but a pull request, and on a pull
  # request only when the diff classification says the scripts are involved. `!cancelled()` is
  # what lets the job evaluate its condition at all when `changes` was skipped (a push), while a
  # `changes` job that FAILED leaves the output empty, so the suites are skipped and the red
  # `changes` check is the head's verdict: fail closed.

  pr-review:
    name: pr-review fixtures (ubuntu)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.scripts == 'true') }}
    runs-on: ubuntu-latest
    # The plain pass. The hostile-locale pass and the CRLF jq repeat are the next two jobs: the
    # passes in one job outgrew a 15-minute cap under a wave's load and timed green runs out with
    # no verdict (ludics-lite#474), and Ubuntu runners are plentiful enough to run them at once.
    # 15, not #474's 10: served by Python (ludics-lite#403), the green runs on v2 took 427-574s
    # (runs 37340116809, 37377439485, 37385847278, 37390277847 attempt 2, 37404230827), one more
    # crossed 10 minutes green step by step (37390277847 attempt 1), and the budget suite came on
    # top (~60s): p90 ~640s, x1.5.
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jq
      - name: Exercise the suites' shared preamble and its shadow guard
        # The negative controls first: a suite that redefines a pr-review.sh function without
        # declaring it must be refused, or the suites below prove less than they print.
        run: ship-pr/scripts/test-pr-review-lib.sh
      - name: Exercise the base suites' shared fixture transport
        # Its own controls over the round counter, the delay and the tip move: the three devices
        # the wall-clock cases below rest on (ludics-lite#179).
        run: ship-pr/scripts/test-pr-review-base-lib.sh
      - name: Exercise the merge-time base-drift intersection
        run: ship-pr/scripts/test-pr-review-base-drift.sh
      - name: Exercise the base command's red report
        run: ship-pr/scripts/test-pr-review-base-red.sh
      - name: Exercise the paths-ignore settle of a tip with no verdict
        run: ship-pr/scripts/test-pr-review-base-settle.sh
      - name: Exercise what the base wait loop decides
        run: ship-pr/scripts/test-pr-review-base-verdict.sh
      - name: Exercise the named verdict sources of a tip no push run judges
        run: ship-pr/scripts/test-pr-review-base-pushless.sh
      - name: Exercise the build gate's absent-vs-not-yet split
        run: ship-pr/scripts/test-pr-review-checks-absent.sh
      - name: Exercise the review-round count
        run: ship-pr/scripts/test-pr-review-rounds.sh
      - name: Exercise the merge command's head binding and close-out refusals
        run: ship-pr/scripts/test-pr-review-merge.sh
      - name: Exercise the status line's conflict flag and the watch-time drift read
        run: ship-pr/scripts/test-pr-review-status.sh
      - name: Exercise what ends a watch and the clock a due review is late against
        run: ship-pr/scripts/test-pr-review-watch.sh
      - name: Exercise the folded reply and resolve
        run: ship-pr/scripts/test-pr-review-reply.sh
      - name: Exercise the plain retry's classification and the run await's addressing
        run: ship-pr/scripts/test-pr-review-retry.sh
      - name: Exercise the polling budget, the quota hold and the one observer per PR
        run: ship-pr/scripts/test-pr-review-budget.sh
      - name: Exercise the live-API contract's own logic against a fixture world
        run: ship-pr/scripts/test-pr-review-api-contract.sh

  pr-review-hostile:
    name: pr-review fixtures, hostile runner (ubuntu)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.scripts == 'true') }}
    runs-on: ubuntu-latest
    # The same pr-review suites again, under the environments that once turned them red, split
    # from the plain pass above (ludics-lite#474). Each pass runs whatever the one before did and
    # names its suite when it fails, as the plain pass's job did for these when they were its tail.
    # The CRLF jq repeat is its own job below since ludics-lite#403: with it, the job crossed
    # #474's 13 minutes green on v2 (run 37404230827: 637s + 166s). The hostile pass alone took
    # 491-663s on v2 (37390277847 both attempts, 37404230827), the budget suite on top (~80s):
    # p90 ~745s, x1.5.
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jq
      - name: Check hostile-runner verdicts with synthetic scratch suites
        run: python3 ship-pr/scripts/test-pr-review-hostile.py || { echo '::error title=suite failed::test-pr-review-hostile.py'; exit 1; }
      - name: Repeat fixtures with inherited names, spaced paths, and a non-C locale
        if: ${{ !cancelled() }}
        run: ship-pr/scripts/run-pr-review-hostile.sh || { echo '::error title=suite failed::run-pr-review-hostile.sh'; exit 1; }

  pr-review-crlf:
    name: pr-review fixtures, CRLF jq (ubuntu)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.scripts == 'true') }}
    runs-on: ubuntu-latest
    # The hostile job's tail until ludics-lite#403 slowed both past its cap: 140-166s on v2
    # (runs 37390277847 attempt 2, 37404230827), x1.5, at the 5-minute floor.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jq
      - name: Repeat the four suites a CRLF jq turned red, over a stub jq.exe
        # A native jq.exe ends its lines CRLF, and these four went red on it under Git Bash
        # (ludics-lite#335). The stub is one that refuses `-b`, the strip path no runner's real jq
        # takes; the Git Bash leg covers `-b` with the real jq.exe.
        env:
          SHIP_PR_TEST_JQ_EOL: crlf-no-binary
        run: |
          ship-pr/scripts/test-pr-review-base-red.sh || { echo '::error title=suite failed::test-pr-review-base-red.sh over a CRLF jq'; exit 1; }
          ship-pr/scripts/test-pr-review-base-settle.sh || { echo '::error title=suite failed::test-pr-review-base-settle.sh over a CRLF jq'; exit 1; }
          ship-pr/scripts/test-pr-review-base-verdict.sh || { echo '::error title=suite failed::test-pr-review-base-verdict.sh over a CRLF jq'; exit 1; }
          ship-pr/scripts/test-pr-review-checks-absent.sh || { echo '::error title=suite failed::test-pr-review-checks-absent.sh over a CRLF jq'; exit 1; }

  cleanup:
    name: post-merge cleanup (ubuntu)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.scripts == 'true') }}
    runs-on: ubuntu-latest
    # One stalled case once held a job for the six-hour default (ludics-lite#14). The suite now
    # kills a case at SHIP_PR_TEST_CASE_TIMEOUT and reports it; this is the backstop.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exercise post-merge branch states
        env:
          SHIP_PR_TEST_LOG_DIR: ${{ runner.temp }}/cleanup-logs
        run: ship-pr/scripts/test-post-merge-cleanup.sh
      - name: Keep the per-case logs
        # The log of a failed or timed-out case is already in the job output; the artifact is
        # for the run that hangs anyway, when the in-flight cases' partial logs are the evidence.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-logs-ubuntu
          path: ${{ runner.temp }}/cleanup-logs
          if-no-files-found: ignore

  wake-lab:
    name: wake-lab (ubuntu)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.scripts == 'true') }}
    runs-on: ubuntu-latest
    # 12, not 5: the suite grew from 211 assertions to 259 with ludics-lite#192, and a good part
    # of the new time is deliberate -- a teardown grace, capped probes that have to be allowed to
    # fire, and a release slowed on purpose so a competing hold can race it. At 5 it was cancelled
    # mid-run, which reads as a failing suite and is not one.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jq
      - name: Exercise the host-table split and the --help range
        run: scripts/test-wake-lab.sh
      - name: Exercise native Linux without the WSL adapter
        run: scripts/test-wake-lab-linux.sh
      - name: Exercise the Linux bootstrap's helpers
        run: python3 scripts/test-install-linux.py
      - name: Exercise the fleet ssh mesh helper
        run: python3 scripts/test-fleet-peers.py

  fleet-worker:
    name: fleet launcher (ubuntu)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.scripts == 'true') }}
    runs-on: ubuntu-latest
    # Re-measured 2026-10-18 (ludics-lite#640's follow-up): 965-1184s over the job's 13 green runs
    # that day (jobs 117711250363 to 117729143780; it had crept to 19.7 of the old 20), x1.5.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The suite installs the real checkout the way the README does and preflights it, so
          # it needs the whole tree, not a shallow view of it.
          fetch-depth: 0
      - uses: ./.github/actions/setup-jq
      - name: Install tmux
        run: |
          set -e
          sudo apt-get update -q && sudo apt-get install -y -q tmux
          command -v tmux && command -v jq
      - name: Exercise execution reservations
        run: python3 issue-wave/scripts/test-fleet-execution.py
      - name: Exercise the fleet launcher against the local box
        # The suite's per-section watchdog (ludics-lite#640), tighter than its 600 s default so a
        # hang in its last section still fails by name inside this job's cap: the slowest section
        # here, `unstick`, took 207-240 s over ten runs (x1.5); the suite starts ~85 s in and takes
        # 853-1042 s.
        env:
          FLEET_WORKER_TEST_SECTION_TIMEOUT: 360
        run: issue-wave/scripts/test-fleet-worker.sh
      - name: Exercise the background-run waiter
        run: issue-wave/scripts/test-bg-run.sh
      - name: Exercise the subagent cache-miss report
        run: python3 issue-wave/scripts/test-cache-misses.py
      - name: Exercise the branch waiter's PR lookup
        run: wait-and-proceed/scripts/test-wait-for.sh

  python:
    name: python package, pyright and unit tests (ubuntu)
    # The v2 rewrite's package, lib/ludics (ludics-lite#403): strict pyright at pythonVersion
    # 3.12 with reportMatchNotExhaustive (pyrightconfig.json), so an unhandled variant of a sum
    # type is red here, and the package's own unittest suites. Pyright runs only here and on the
    # dev machine, never at run time, so the boxes carry no Node dependency; the version is
    # pinned so a pyright release cannot turn a head red that was green. Pyright evaluates a
    # `sys.platform` branch only for the platform it checks, and on this runner that is Linux, so
    # a second step checks the package as Darwin: fleetworker/group.py's kqueue wait is otherwise
    # never type-checked. Windows is not a step: the package is POSIX-only (fcntl.flock, os.fork,
    # os.killpg, SIGALRM), and `--pythonplatform Windows` reports those as errors throughout.
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.scripts == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Type-check the package (pyright, strict, pythonVersion 3.12)
        run: npx --yes pyright@1.1.414
      - name: Type-check the package's macOS branches (pyright, --pythonplatform Darwin)
        run: npx --yes pyright@1.1.414 --pythonplatform Darwin
      - name: The package's unit tests
        run: scripts/py -m unittest discover -s lib -t lib -p 'test_*.py' -v

  # ---- every script suite on macOS, two jobs, two runner assignments -----------------------
  #
  # ludics-lite#55 collapsed four macOS jobs into one because four runner assignments per head
  # queued a green PR for 111-120 minutes during a three-PR wave. Splitting back out to two is
  # a deliberate reversal of part of that, and the trade was measured rather than assumed.
  # Across the 97 macOS assignments of 2026-09-17..18 the wait for a runner was a median 9s
  # but heavy-tailed -- p75 45s, p90 434s, p95 577s, max 1285s, mean 106s (Ubuntu over the
  # same runs: median 2s, p95 19s; the scarcity is macOS-specific and still real). A second
  # assignment costs one more draw from that tail, and the run's wall clock is the LARGER of
  # the two draws. What buys it back is 522s: the suites take ~1110s in one job and the bigger
  # half takes ~588s. The mean wait is a fifth of that, so even assuming the two draws are
  # independent -- the pessimistic end, since two jobs submitted together into a starved pool
  # wait together -- the trade is positive, and it is the merge gate's critical path it buys.
  #
  # So the ceiling being defended here is RUNTIME, not the assignment count: ~18 minutes was
  # tolerable, half an hour would not be. Should the tail get worse and starve these jobs, the
  # answer is NOT a third assignment -- #55 is what that looks like, and the runtime each new
  # job saves shrinks while the max-of-N penalty grows. Move suites off the per-push path onto
  # periodic CI instead, and keep two assignments per head.
  #
  # The two halves are split along what they exercise -- ship-pr's own suites here, the repo
  # and fleet guards below -- rather than by time alone, so a new suite has an obvious home.
  # Rebalance only if one half's measured time drifts well past the other's.

  macos-ship-pr:
    name: bash 3.2 suites, ship-pr (macos)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.scripts == 'true') }}
    runs-on: macos-latest
    # The cleanup suite kills a stalled case at SHIP_PR_TEST_CASE_TIMEOUT (ludics-lite#14), so
    # this is the backstop behind that, sized for the whole sequence by THE CAPS above. Re-measured
    # on v2 (ludics-lite#403): 1086-1167s over the runs named at fleet-worker, x1.5.
    timeout-minutes: 30
    steps:
      # A shallow checkout, as the ubuntu ship-pr jobs take: these suites build their own
      # scratch repositories. The full history belongs to the fleet launcher, in the job below.
      - uses: actions/checkout@v4
      # No brew install here: tmux belongs to the fleet launcher, in the other job. The image
      # ships a jq of its own, but not necessarily the fleet's patch release, so the suites below
      # run the pinned one, as every job that runs jq does (ludics-lite#508).
      - uses: ./.github/actions/setup-jq
      # The subcommands ported to Python run through scripts/py, which needs a Python >= 3.12
      # (ludics-lite#403); the image's own python3 is not promised to be one.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Every suite step below runs whether or not an earlier one failed, and a failure names
      # its suite in the run's annotations; the job's conclusion is red if any step's is.
      - name: ship-pr nudge
        if: ${{ !cancelled() }}
        run: python3 ship-pr/hooks/test-ship-pr-nudge.py || { echo '::error title=macOS suite failed::test-ship-pr-nudge.py'; exit 1; }
      - name: pr-review fixtures, shared preamble and shadow guard
        if: ${{ !cancelled() }}
        run: ship-pr/scripts/test-pr-review-lib.sh || { echo '::error title=macOS suite failed::test-pr-review-lib.sh'; exit 1; }
      - name: pr-review fixtures, the base suites' shared fixture transport
        if: ${{ !cancelled() }}
        run: ship-pr/scripts/test-pr-review-base-lib.sh || { echo '::error title=macOS suite failed::test-pr-review-base-lib.sh'; exit 1; }
      - name: pr-review fixtures, base drift
        if: ${{ !cancelled() }}
        run: ship-pr/scripts/test-pr-review-base-drift.sh || { echo '::error title=macOS suite failed::test-pr-review-base-drift.sh'; exit 1; }
      - name: pr-review fixtures, the base command's red report
        if: ${{ !cancelled() }}
        run: ship-pr/scripts/test-pr-review-base-red.sh || { echo '::error title=macOS suite failed::test-pr-review-base-red.sh'; exit 1; }
      - name: pr-review fixtures, the paths-ignore settle
        if: ${{ !cancelled() }}
        run: ship-pr/scripts/test-pr-review-base-settle.sh || { echo '::error title=macOS suite failed::test-pr-review-base-settle.sh'; exit 1; }
      - name: pr-review fixtures, what the base wait loop decides
        if: ${{ !cancelled() }}
        run: ship-pr/scripts/test-pr-review-base-verdict.sh || { echo '::error title=macOS suite failed::test-pr-review-base-verdict.sh'; exit 1; }
      - name: pr-review fixtures, the named sources of a tip no push run judges
        if: ${{ !cancelled() }}
        run: ship-pr/scripts/test-pr-review-base-pushless.sh || { echo '::error title=macOS suite failed::test-pr-review-base-pushless.sh'; exit 1; }
      - name: pr-review fixtures, absent vs not yet
        if: ${{ !cancelled() }}
        run: ship-pr/scripts/test-pr-review-checks-absent.sh || { echo '::error title=macOS suite failed::test-pr-review-checks-absent.sh'; exit 1; }
      - name: pr-review fixtures, review rounds
        if: ${{ !cancelled() }}
        run: ship-pr/scripts/test-pr-review-rounds.sh || { echo '::error title=macOS suite failed::test-pr-review-rounds.sh'; exit 1; }
      - name: pr-review fixtures, merge
        if: ${{ !cancelled() }}
        run: ship-pr/scripts/test-pr-review-merge.sh || { echo '::error title=macOS suite failed::test-pr-review-merge.sh'; exit 1; }
      - name: pr-review fixtures, status and watch
        if: ${{ !cancelled() }}
        run: ship-pr/scripts/test-pr-review-status.sh || { echo '::error title=macOS suite failed::test-pr-review-status.sh'; exit 1; }
      - name: pr-review fixtures, what ends a watch
        if: ${{ !cancelled() }}
        run: ship-pr/scripts/test-pr-review-watch.sh || { echo '::error title=macOS suite failed::test-pr-review-watch.sh'; exit 1; }
      - name: pr-review fixtures, the folded reply and resolve
        if: ${{ !cancelled() }}
        run: ship-pr/scripts/test-pr-review-reply.sh || { echo '::error title=macOS suite failed::test-pr-review-reply.sh'; exit 1; }
      - name: pr-review fixtures, the plain retry and the run await
        if: ${{ !cancelled() }}
        run: ship-pr/scripts/test-pr-review-retry.sh || { echo '::error title=macOS suite failed::test-pr-review-retry.sh'; exit 1; }
      - name: pr-review fixtures, the polling budget
        if: ${{ !cancelled() }}
        run: ship-pr/scripts/test-pr-review-budget.sh || { echo '::error title=macOS suite failed::test-pr-review-budget.sh'; exit 1; }
      - name: pr-review fixtures, the live-API contract's own logic
        if: ${{ !cancelled() }}
        run: ship-pr/scripts/test-pr-review-api-contract.sh || { echo '::error title=macOS suite failed::test-pr-review-api-contract.sh'; exit 1; }
      - name: post-merge cleanup
        if: ${{ !cancelled() }}
        # The per-case logs go OUTSIDE the checkout, as on the Ubuntu leg. The fleet launcher
        # suite -- which refuses a top-level directory it does not know, and so would refuse a
        # `cleanup-logs/` in the workspace -- now runs in the other macOS job, but keeping the
        # logs in the runner temp is what the upload step below reads either way.
        env:
          SHIP_PR_TEST_LOG_DIR: ${{ runner.temp }}/cleanup-logs
        run: ship-pr/scripts/test-post-merge-cleanup.sh || { echo '::error title=macOS suite failed::test-post-merge-cleanup.sh'; exit 1; }
      - name: Keep the cleanup suite's per-case logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-logs-macos
          path: ${{ runner.temp }}/cleanup-logs
          if-no-files-found: ignore

  macos-repo:
    name: bash 3.2 suites, repo and fleet (macos)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.scripts == 'true') }}
    runs-on: macos-latest
    # The merge gate's critical path, and the job that drifts: its fleet launcher suite grows
    # with each stream-channel case that waits in real time (ludics-lite#259). Sized by THE CAPS
    # above; splitting it was considered and declined (ludics-lite#474). Re-measured on v2
    # (ludics-lite#403): 1822-2088s over the runs named at fleet-worker, x1.5.
    timeout-minutes: 53
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the fleet launcher suite installs and preflights the real checkout
      - uses: ./.github/actions/setup-jq
      # scripts/test-py.sh asserts this runner has a Python >= 3.12 for scripts/py to find.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tmux
        run: |
          set -e
          brew list tmux >/dev/null 2>&1 || brew install tmux
          command -v tmux && command -v jq
      # Every suite step below runs whether or not an earlier one failed, and a failure names
      # its suite in the run's annotations; the job's conclusion is red if any step's is.
      - name: wake-lab
        if: ${{ !cancelled() }}
        run: scripts/test-wake-lab.sh || { echo '::error title=macOS suite failed::test-wake-lab.sh'; exit 1; }
      - name: wake-lab linux
        if: ${{ !cancelled() }}
        run: scripts/test-wake-lab-linux.sh || { echo '::error title=macOS suite failed::test-wake-lab-linux.sh'; exit 1; }
      - name: Linux bootstrap helpers
        if: ${{ !cancelled() }}
        run: python3 scripts/test-install-linux.py || { echo '::error title=macOS suite failed::test-install-linux.py'; exit 1; }
      - name: fleet ssh mesh helper
        if: ${{ !cancelled() }}
        run: python3 scripts/test-fleet-peers.py || { echo '::error title=macOS suite failed::test-fleet-peers.py'; exit 1; }
      - name: sync-routines
        if: ${{ !cancelled() }}
        run: scripts/test-sync-routines.sh || { echo '::error title=macOS suite failed::test-sync-routines.sh'; exit 1; }
      - name: prompt checker fixtures
        if: ${{ !cancelled() }}
        run: scripts/test-check-prompts.sh || { echo '::error title=macOS suite failed::test-check-prompts.sh'; exit 1; }
      - name: jq shape guard fixtures
        if: ${{ !cancelled() }}
        run: scripts/test-check-jq-shapes.sh || { echo '::error title=macOS suite failed::test-check-jq-shapes.sh'; exit 1; }
      - name: scratch directory guard fixtures
        # The one platform where the rule has teeth: /var and /tmp are symlinks into /private
        # here, so a probe that passes on Ubuntu because the two spellings coincide is judged for
        # real on this leg.
        if: ${{ !cancelled() }}
        run: scripts/test-check-scratch-dirs.sh || { echo '::error title=macOS suite failed::test-check-scratch-dirs.sh'; exit 1; }
      - name: parse guard fixtures
        # bash 3.2: the `|| return 0` dispatch that keeps a sourced library's caller alive inside
        # the brace group, and the offset the appended-line controls turn on, are both read by the
        # shell the fleet actually runs.
        if: ${{ !cancelled() }}
        run: scripts/test-check-parse-guards.sh || { echo '::error title=macOS suite failed::test-check-parse-guards.sh'; exit 1; }
      - name: preflight fixtures
        # bash 3.2 is the fleet's shell and the preflight's home ground: it is run locally on
        # these macs far more often than in CI.
        if: ${{ !cancelled() }}
        run: scripts/test-preflight.sh || { echo '::error title=macOS suite failed::test-preflight.sh'; exit 1; }
      - name: base negative-control helper
        if: ${{ !cancelled() }}
        run: scripts/test-run-against-base.sh || { echo '::error title=macOS suite failed::test-run-against-base.sh'; exit 1; }
      - name: Python interpreter wrapper
        if: ${{ !cancelled() }}
        run: scripts/test-py.sh || { echo '::error title=macOS suite failed::test-py.sh'; exit 1; }
      - name: execution reservations
        if: ${{ !cancelled() }}
        run: python3 issue-wave/scripts/test-fleet-execution.py || { echo '::error title=macOS suite failed::test-fleet-execution.py'; exit 1; }
      - name: fleet launcher
        if: ${{ !cancelled() }}
        run: issue-wave/scripts/test-fleet-worker.sh || { echo '::error title=macOS suite failed::test-fleet-worker.sh'; exit 1; }
      - name: background-run waiter
        if: ${{ !cancelled() }}
        run: issue-wave/scripts/test-bg-run.sh || { echo '::error title=macOS suite failed::test-bg-run.sh'; exit 1; }
      - name: subagent cache-miss report
        if: ${{ !cancelled() }}
        run: python3 issue-wave/scripts/test-cache-misses.py || { echo '::error title=macOS suite failed::test-cache-misses.py'; exit 1; }
      - name: branch waiter
        if: ${{ !cancelled() }}
        run: wait-and-proceed/scripts/test-wait-for.sh || { echo '::error title=macOS suite failed::test-wait-for.sh'; exit 1; }

  windows-driver:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.scripts == 'true') }}
    name: bounded Windows driver (PowerShell 5.1 and 7)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 verdicts and owned-tree timeout
        shell: powershell
        run: ./issue-wave/scripts/test-windows-driver.ps1
      - name: PowerShell 7 verdicts and owned-tree timeout
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./issue-wave/scripts/test-windows-driver.ps1

  # ship-pr's shell suites under Git Bash run nightly and on dispatch, not here:
  # windows-git-bash.yml (ludics-lite#339).
